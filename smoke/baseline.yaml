# Cross-repo regression suite. Runs before every change's own smoke file.
#
# Steps land here by promotion, during /realign: the assertions from a merged change that
# are worth keeping forever move here, so the loop stops re-breaking what an earlier change
# fixed. Keep it fast and keep it about the SEAM — anything provable inside one repo belongs
# in that repo's own suite.

steps:
  # Not API surface: contracts/openapi.yaml promises the API, not the app shell, so
  # these two opt out of the contract check rather than failing it.
  - name: origin-serves-app
    owner: frontend
    GET: /
    contract: false
    expect:
      status: 200
      body_matches: '<div id="root"'

  - name: origin-serves-frontend-health
    owner: frontend
    GET: /healthz
    contract: false
    expect:
      status: 200

  # The assertion this harness exists for: before stack/compose.yml joined the two compose
  # projects onto one network this returned 502, because the proxy could not resolve
  # `backend`. The single check that proves the two repos are actually wired.
  - name: origin-reaches-backend
    owner: chatbot-backend
    GET: /api/healthz
    expect:
      status: 200
      json:
        status: ok

  - name: backend-direct-health
    owner: chatbot-backend
    GET: /healthz
    # Bypasses the proxy. When origin-reaches-backend fails but this passes, the fault is
    # the proxy wiring rather than the backend. Local-only: a container port has no remote
    # analogue, and a directly reachable backend in a deployed environment is a finding.
    base: ${BACKEND_DIRECT_BASE}
    tags: [local]
    expect:
      status: 200

  # --------------------------------------------------------- the /api prefix posture
  # contracts/README.md § "The /api prefix is an asserted invariant". These are untagged
  # because they are invariants of ANY origin, and asserting them locally too is what
  # keeps the local pass honest about the same property.

  - name: api-prefix-reaches-the-api
    owner: chatbot-backend
    GET: /api/healthz
    expect:
      status: 200
      json:
        status: ok
      # The `json` clause already forces a decodable body, so the SPA shell fails it. This
      # is belt-and-braces AND documentation: a future author cannot weaken this step
      # without deleting a line that says what it is for. The frontend answers any
      # unmatched path with the shell and a 200, so an edge that fails to match /api/*
      # returns 200 text/html rather than a 404.
      body_excludes: '<div id="root"'

  - name: api-prefix-is-not-doubled
    owner: chatbot-backend
    # THE ONE THAT EARNS ITS PLACE. Locally Caddy's handle_path strips one /api, the
    # backend sees /api/healthz, and 404 is the pass. If someone makes the backend
    # prefix-aware instead — FastAPI(root_path="/api") — it serves 200 and this fails.
    # That catches the shortcut from outside, without reading any code, at the moment it
    # is introduced rather than when someone notices the contract has become a lie.
    GET: /api/api/healthz
    # A deliberately undeclared path must not be checked against the spec.
    contract: false
    expect:
      status: 404

  - name: prefix-boundary-is-respected
    owner: frontend
    # A path that merely BEGINS with the characters `api` must reach the app. handle_path
    # /api/* already gets this right, so it is free locally; remotely it catches a rule
    # written /api* instead of /api/*.
    GET: /apiary
    contract: false
    expect:
      status: 200
      body_matches: '<div id="root"'

  # ── promoted from 0002-chat-auth-and-real-backend ──────────────────────────────────
  # The seam this change closed: a session established at the origin, its cookie crossing
  # the proxy, and chat refusing without it. No single repo can prove any of that — the
  # cookie only crosses a proxy when there is one.
  #
  # ORDER IS LOAD-BEARING, and it survived promotion for the same reason it mattered in
  # the change: the cookie jar persists across steps, so the anonymous refusal must stay
  # ABOVE the login and the revocation pair must stay BELOW every authenticated step. A
  # reordering does not fail loudly — it turns each of them into a tautology.
  #
  # NOT promoted: chat-route-deep-links-to-the-app. `/chat` returning the app shell is the
  # SPA fallback that origin-serves-app and prefix-boundary-is-respected already cover, it
  # is provable inside the frontend repo, and its own comment admits it says nothing about
  # the UI calling the backend. That criterion belongs to tests/e2e/real-backend.spec.ts.

  - name: chat-without-a-session-is-refused
    owner: chatbot-backend
    # ABOVE the login, deliberately — see the ordering note above.
    POST: /api/v1/chat
    body:
      message: This request has no session cookie and must not reach a model.
    expect:
      status: 401
      json:
        error:
          code: AUTH_REQUIRED
      # A refusal must not carry a reply. If the handler authenticates AFTER invoking the
      # graph, the money is already spent and only this line notices.
      body_excludes: '"reply"'

  - name: creating-a-chat-requires-a-session
    owner: chatbot-backend
    # Up here with the other anonymous refusal, for the same reason: below the login it
    # asserts nothing. Promoted from 0003.
    POST: /api/v1/threads
    body: {}
    expect:
      status: 401
      json:
        error:
          code: AUTH_REQUIRED
      # A refusal must not have created anything. If the handler authenticates after the
      # insert, the row is already there and only this line notices.
      body_excludes: '"id"'

  - name: listing-chats-requires-a-session
    owner: chatbot-backend
    # The read path, gated separately. A GET carries no body to validate and trips no
    # cross-origin guard, so nothing else would catch a list endpoint that answers 200 with
    # an empty array to a stranger — which reads as a working empty state rather than a hole.
    GET: /api/v1/threads
    expect:
      status: 401
      json:
        error:
          code: AUTH_REQUIRED
      body_excludes: '"threads"'

  - name: register-a-chat-account
    owner: chatbot-backend
    POST: /api/v1/auth/register
    body:
      email: smoke-baseline-${SMOKE_RUN_ID}@auth.test
      password: "${SMOKE_PASSWORD}"
      signup_code: "${SIGNUP_CODE}"
      display_name: Smoke Baseline
    expect:
      # 201 cold, 409 when a previous run left the volume behind. Both prove the endpoint
      # works; the session comes from the login step below, never from this one.
      status: [201, 409]

  - name: login-establishes-the-session
    owner: chatbot-backend
    POST: /api/v1/auth/login
    body:
      email: smoke-baseline-${SMOKE_RUN_ID}@auth.test
      password: "${SMOKE_PASSWORD}"
    expect:
      status: 200
      cookie: session
    capture:
      # The jar CLEARS this cookie at logout, so the revocation step below replays this
      # exact value by hand. Without it that step would send nothing and be a second copy
      # of chat-without-a-session-is-refused wearing a more impressive name.
      session_value: cookie:session

  - name: chat-with-a-session-answers
    owner: chatbot-backend
    # The positive half, and it is here to stop the rest becoming a tautology: a backend
    # whose gate is stuck closed passes every 401 assertion in this block and fails only
    # this one. CHAT_MODEL is undeclared in stack/dev.env on purpose (docs/adr/0006), so
    # CI answers with `echo` and a developer holding credentials answers with Bedrock —
    # the assertion is a NON-EMPTY reply, which both satisfy.
    POST: /api/v1/chat
    body:
      message: Reply with a single short sentence.
    expect:
      status: 200
      # Asserted as a body property rather than a bare status: the frontend answers any
      # unmatched path with the app shell and a 200, so a status-only assertion would pass
      # against an edge that never routed /api/* at all. `[^"]` rules out `{"reply":""}`.
      body_matches: '"reply"\s*:\s*"[^"]'
    retry:
      # A real model over the network, possibly cold-started.
      attempts: 3
      delay: 3.0

  - name: chat-still-validates-the-body
    owner: chatbot-backend
    # Auth is a gate in FRONT of validation, not a replacement for it. A client that
    # distinguishes the two error shapes keeps working only while this stays true.
    POST: /api/v1/chat
    body:
      message: ""
    expect:
      status: 422
      body_matches: '"detail"'

  - name: logout-then-chat-is-refused
    owner: chatbot-backend
    # BELOW every authenticated step — this empties the cookie jar.
    POST: /api/v1/auth/logout
    expect:
      status: 204

  - name: revoked-session-cannot-chat
    owner: chatbot-backend
    # The step that makes the gate mean something: a handler that merely checks "is there
    # a cookie" passes everything above and fails here, because logout deletes the
    # server-side record rather than waiting for it to expire.
    POST: /api/v1/chat
    headers:
      Cookie: session=${session_value}
    body:
      message: The session behind this cookie was just deleted server-side.
    expect:
      status: 401
      json:
        error:
          code: AUTH_REQUIRED
      body_excludes: '"reply"'

  # ─────────────────────────────────────────────────── chats belong to one account (0003)
  #
  # Promoted as a BLOCK, and it has to be. All three `another-user-cannot-*` steps assert a
  # 404, which a backend whose chats are simply unreachable also returns — so promoting them
  # alone would have installed three tautologies. What makes them mean anything is
  # `the-chat-survived-the-other-users-attempts` below them, and that step needs a real chat
  # with a real transcript above it. Take the block or take none of it.
  #
  # The jar is empty here: `logout-then-chat-is-refused` above emptied it and
  # `revoked-session-cannot-chat` sends its cookie as an explicit header without
  # repopulating it. So this block establishes its own two sessions.
  #
  # NOT promoted from 0003: `chat-appears-in-its-owners-list` and
  # `a-chat-gets-a-title-without-being-asked`, both subsumed — the first by
  # `the-list-shows-the-new-name`, the second by `rename-survives-a-reread` reading the same
  # record. And `chat-deep-link-serves-the-app`, for the reason its 0002 analogue was left
  # behind: `/chat/<id>` returning the app shell is SPA fallback that `origin-serves-app` and
  # `prefix-boundary-is-respected` already cover, and it says nothing about the UI consuming
  # any of this. That criterion belongs to tests/e2e/real-backend.spec.ts.
  #
  # COST, stated because it is the reason to think before adding more: this block makes two
  # model calls. The baseline made one before it. That is deliberate — chats are now the
  # product, and `transcript-persists-in-order` asserting four alternating messages is the
  # step that catches a broken seam. Weakening it to one turn to save a few seconds would
  # trade away the assertion this block exists for.

  - name: register-chat-owner
    owner: chatbot-backend
    POST: /api/v1/auth/register
    body:
      email: smoke-baseline-owner-${SMOKE_RUN_ID}@auth.test
      password: "${SMOKE_PASSWORD}"
      signup_code: "${SIGNUP_CODE}"
      display_name: Baseline Owner
    expect:
      # 201 cold, 409 once this account exists. The session comes from the login below.
      status: [201, 409]

  - name: login-chat-owner
    owner: chatbot-backend
    POST: /api/v1/auth/login
    body:
      email: smoke-baseline-owner-${SMOKE_RUN_ID}@auth.test
      password: "${SMOKE_PASSWORD}"
    expect:
      status: 200
      cookie: session
    capture:
      # The jar is handed to the second account below and then emptied, so the owner is
      # re-addressed by hand afterwards. http.cookiejar leaves an explicit Cookie header
      # alone, so the replay is what reaches the backend.
      owner_session: cookie:session

  - name: create-a-chat
    owner: chatbot-backend
    POST: /api/v1/threads
    body: {}
    expect:
      status: 201
      body_matches: '"id"\s*:\s*"[^"]'
    capture:
      thread_id: thread.id

  - name: first-message-titles-the-chat
    owner: chatbot-backend
    POST: /api/v1/threads/${thread_id}/messages
    body:
      message: Name three colours, one per line.
    expect:
      status: 200
      # Non-empty. `[^"]` is the point — it rules out `{"reply":""}`.
      body_matches: '"reply"\s*:\s*"[^"]'
    retry:
      attempts: 3
      delay: 3.0

  - name: a-second-message-is-accepted
    owner: chatbot-backend
    # Sending into an EXISTING chat is a different path from the first message — it is the
    # one that assembles history. This suite can only assert that it succeeds: under
    # CHAT_MODEL=echo nothing could demonstrate recall, and an assertion that worked under
    # echo would depend on how the backend formats history into the prompt. Whether the
    # model actually receives the earlier turns is a chatbot-backend test against a
    # recording fake.
    POST: /api/v1/threads/${thread_id}/messages
    body:
      message: And now three more, different from those.
    expect:
      status: 200
      body_matches: '"reply"\s*:\s*"[^"]'
    retry:
      attempts: 3
      delay: 3.0

  - name: transcript-persists-in-order
    owner: chatbot-backend
    GET: /api/v1/threads/${thread_id}
    # Four messages, alternating, user first — read back from storage rather than echoed
    # from the requests that wrote them. `message_count` is asserted so a transcript that
    # returns the turns but miscounts them cannot pass, and the regex asserts the ORDER,
    # which the count cannot. re.S is on, so `.*` crosses the newlines in the body.
    expect:
      status: 200
      json:
        thread:
          message_count: 4
      body_matches: '"role"\s*:\s*"user".*"role"\s*:\s*"assistant".*"role"\s*:\s*"user".*"role"\s*:\s*"assistant"'

  - name: rename-a-chat
    owner: chatbot-backend
    PATCH: /api/v1/threads/${thread_id}
    # The title carries the chat id rather than the run id, so a chat left behind by a run
    # that died midway cannot make the list assertion below pass by accident.
    body:
      title: Renamed in baseline ${thread_id}
    expect:
      status: 200
      json:
        thread:
          title: Renamed in baseline ${thread_id}

  - name: rename-survives-a-reread
    owner: chatbot-backend
    GET: /api/v1/threads/${thread_id}
    # The PATCH response above is satisfied by a handler that echoes the title it was sent
    # and writes nothing. Only a fresh read proves it was stored.
    expect:
      status: 200
      json:
        thread:
          title: Renamed in baseline ${thread_id}

  - name: the-list-shows-the-new-name
    owner: chatbot-backend
    GET: /api/v1/threads
    # A title stored on the detail record but absent from the list is what a sidebar would
    # actually show, so the list is asserted separately rather than assumed.
    expect:
      status: 200
      body_matches: 'Renamed in baseline ${thread_id}'

  - name: register-another-account
    owner: chatbot-backend
    # From here the jar holds the OTHER account. Every owner step below re-addresses the
    # owner by hand.
    POST: /api/v1/auth/register
    body:
      email: smoke-baseline-other-${SMOKE_RUN_ID}@auth.test
      password: "${SMOKE_PASSWORD}"
      signup_code: "${SIGNUP_CODE}"
      display_name: Baseline Other
    expect:
      status: [201, 409]

  - name: login-another-account
    owner: chatbot-backend
    POST: /api/v1/auth/login
    body:
      email: smoke-baseline-other-${SMOKE_RUN_ID}@auth.test
      password: "${SMOKE_PASSWORD}"
    expect:
      status: 200
      cookie: session

  - name: another-user-cannot-read-the-chat
    owner: chatbot-backend
    GET: /api/v1/threads/${thread_id}
    # 404 and not 403, by contract: a 403 would confirm the chat exists, which makes chat
    # ids an enumeration oracle — and they appear in URLs people paste. The body must not
    # leak the transcript either.
    expect:
      status: 404
      json:
        error:
          code: THREAD_NOT_FOUND
      body_excludes: '"messages"'

  - name: another-user-cannot-rename-the-chat
    owner: chatbot-backend
    PATCH: /api/v1/threads/${thread_id}
    body:
      title: Renamed by somebody who does not own this
    expect:
      status: 404
      json:
        error:
          code: THREAD_NOT_FOUND

  - name: another-user-cannot-delete-the-chat
    owner: chatbot-backend
    DELETE: /api/v1/threads/${thread_id}
    expect:
      status: 404
      json:
        error:
          code: THREAD_NOT_FOUND

  - name: the-other-users-list-does-not-contain-it
    owner: chatbot-backend
    GET: /api/v1/threads
    # The listing is scoped per account, not merely the detail read. A list that returns
    # everybody's chats while the detail endpoint guards correctly leaks every title and
    # every id in the deployment, and none of the three 404s above would notice.
    expect:
      status: 200
      body_excludes: '${thread_id}'

  - name: logout-the-other-account
    owner: chatbot-backend
    # Positional, not incidental. This empties the jar so the owner's replayed cookie below
    # is the only identity on the request. Without it two identities travel together and
    # whichever the backend happens to read decides whether a correct implementation passes.
    POST: /api/v1/auth/logout
    expect:
      status: 204

  - name: the-chat-survived-the-other-users-attempts
    owner: chatbot-backend
    GET: /api/v1/threads/${thread_id}
    headers:
      Cookie: session=${owner_session}
    # THE step this block exists for. Everything above is satisfied by a backend that
    # deletes the chat and then honestly reports it missing — from the other account's side
    # the refusal and the destruction look identical. Only the owner reading it back, with
    # its title and its transcript intact, tells an ownership check apart from a delete.
    expect:
      status: 200
      json:
        thread:
          title: Renamed in baseline ${thread_id}
      body_matches: '"role"\s*:\s*"assistant"'

  - name: the-owner-deletes-the-chat
    owner: chatbot-backend
    DELETE: /api/v1/threads/${thread_id}
    headers:
      Cookie: session=${owner_session}
    # Also what keeps this account's chat list from growing by one on every run.
    expect:
      status: 204

  - name: a-deleted-chat-is-gone
    owner: chatbot-backend
    GET: /api/v1/threads/${thread_id}
    headers:
      Cookie: session=${owner_session}
    # The same 404 the other account got. A deleted chat and a chat that was never yours
    # are indistinguishable, which is the point.
    expect:
      status: 404
      json:
        error:
          code: THREAD_NOT_FOUND

  - name: a-deleted-chat-leaves-the-list
    owner: chatbot-backend
    GET: /api/v1/threads
    headers:
      Cookie: session=${owner_session}
    # A delete that removes the detail record but leaves the row the sidebar reads is a chat
    # the person still sees and can no longer open — worse than no delete at all, and the
    # step above cannot see it.
    expect:
      status: 200
      body_excludes: '${thread_id}'

  # ============================================================================ 0004
  # Promoted from changes/0004-rag-knowledge-base/smoke.yaml at realign. The knowledge
  # base adds two datastores to the joined stack — OpenSearch and MinIO — and these steps
  # exist because nothing else here would notice either going missing. Everything below
  # re-addresses the owner by hand with ${owner_session}, exactly as the chat steps above
  # do, because the jar was emptied by `logout-the-other-account`.
  #
  # WHAT WAS DELIBERATELY NOT PROMOTED, and why:
  #   * the document ownership trio (a stranger's 404s, then the owner reading it back).
  #     It costs a second registration — two argon2 rounds — and the identical doctrine is
  #     already asserted at this seam by the chat trio above. It stays in the change suite
  #     and in chatbot-backend's own tests.
  #   * the router's negative branch (an unrelated question consults nothing). A second
  #     model call for a property that is cheaper and sharper to assert in the backend.
  #   * the summary-for-the-router read, which is a step about an internal input.

  - name: creating-a-document-requires-a-session
    owner: chatbot-backend
    POST: /api/v1/documents
    # Anonymous, and it only is anonymous because `logout-the-other-account` above emptied
    # the jar and every step since has re-addressed the owner with an explicit header,
    # which http.cookiejar does not learn from. Moving this above that logout makes it
    # assert nothing.
    body:
      filename: anonymous.md
      content_type: text/markdown
      content: "Nobody should be able to put this anywhere."
    expect:
      status: 401
      json:
        error:
          code: AUTH_REQUIRED
      body_excludes: '"id"'

  - name: listing-documents-requires-a-session
    owner: chatbot-backend
    GET: /api/v1/documents
    expect:
      status: 401
      json:
        error:
          code: AUTH_REQUIRED
      body_excludes: '"documents"'

  - name: an-unsupported-content-type-is-refused
    owner: chatbot-backend
    POST: /api/v1/documents
    headers:
      Cookie: session=${owner_session}
    body:
      filename: balance.csv
      content_type: text/csv
      content: "quarter,revenue\nQ3,41\n"
    # 422 rather than the error envelope: the accepted set is stated policy, and stated
    # policy is validation. The size limit is NOT asserted here — it is 10 MB, and no
    # fixture short enough to belong in this file can reach it.
    expect:
      status: 422
      body_excludes: '"document"'

  - name: a-document-can-be-added-to-the-knowledge-base
    owner: chatbot-backend
    POST: /api/v1/documents
    headers:
      Cookie: session=${owner_session}
    body:
      filename: baseline-charter.md
      content_type: text/markdown
      content: |
        # The Quillhaven Charter

        The council reaches quorum at seven members. Below seven it may adjourn and it may
        record minutes, and it may do nothing else. A vote taken below quorum is void even
        if every member present agrees.

        Between the first frost and the thaw the council does not sit. Urgent matters go to
        the harbourmaster, whose decisions stand until the council next reaches quorum and
        either affirms or reverses them.

        The charter is amended by two consecutive votes at quorum, taken in different
        sittings, with the text unchanged between them. A single vote amends nothing.

        The harbourmaster is appointed for three years and may not sit on the council in
        the same period. The office exists so that the winter recess does not leave the
        settlement unable to decide anything, and its powers are deliberately broad in
        that window and narrow outside it.

        Every vote is recorded with the count and the names. A vote whose record is lost is
        treated as void rather than as carried, which is the same principle the quorum rule
        rests on.
    # At least two chunks, because the one-citation-per-document assertion below is vacuous
    # against a document that can only ever contribute one.
    expect:
      status: 201
      json:
        document:
          filename: baseline-charter.md
          status: ready
      body_matches: '"chunk_count":\s*[2-9]'
    capture:
      document_id: document.id
    retry:
      attempts: 3
      delay: 3

  - name: the-stored-original-is-served-back
    owner: chatbot-backend
    GET: /api/v1/documents/${document_id}/content
    headers:
      Cookie: session=${owner_session}
    # The object store, reached through the joined stack. The index is derived data and can
    # be rebuilt; this is the only step in this file that proves the SYSTEM OF RECORD is
    # readable, and a MinIO that never came up fails right here rather than three steps later
    # as a confusing retrieval miss.
    expect:
      status: 200
      headers:
        content-type: text/markdown
      body_matches: The council reaches quorum at seven members\.

  - name: a-chat-for-the-knowledge-base
    owner: chatbot-backend
    POST: /api/v1/threads
    headers:
      Cookie: session=${owner_session}
    # The chat above was deleted by its owner, so this needs its own.
    expect:
      status: 201
    capture:
      kb_thread_id: thread.id

  - name: a-question-about-the-document-is-answered-with-one-citation
    owner: chatbot-backend
    POST: /api/v1/threads/${kb_thread_id}/messages
    headers:
      Cookie: session=${owner_session}
    body:
      message: "What does the Quillhaven charter say about quorum?"
    # The whole knowledge base in one step: the router chose to consult it, OpenSearch
    # returned something from the right document, and the citation carries the marker the
    # answer refers to. The body_excludes is the one-citation-per-document promise — the
    # charter spans several chunks and this question matches more than one, so an
    # implementation that cites per CHUNK names the file twice and fails here.
    expect:
      status: 200
      json:
        messages:
          - role: user
          - role: assistant
            retrieval_consulted: true
            citations:
              - marker: 1
                document_id: ${document_id}
                filename: baseline-charter.md
      body_excludes: 'baseline-charter\.md(?:.|\n)*baseline-charter\.md'
    retry:
      attempts: 3
      delay: 3

  - name: deleting-a-document-empties-both-stores
    owner: chatbot-backend
    DELETE: /api/v1/documents/${document_id}
    headers:
      Cookie: session=${owner_session}
    expect:
      status: 204

  - name: the-deleted-documents-original-is-gone-too
    owner: chatbot-backend
    GET: /api/v1/documents/${document_id}/content
    headers:
      Cookie: session=${owner_session}
    # Deleting the row and leaving the object is the easy half-delete to write and the hard
    # one to notice: every metadata assertion passes and the bytes accumulate in a bucket
    # nobody is accounting for.
    expect:
      status: 404
      body_excludes: The council reaches quorum at seven members\.

  # ═══════════════════════════════════════════════════════════════════════════════════
  # Promoted from changes/0005-observability-phoenix, 2026-09-02.
  #
  # Fifteen of that change's eighteen steps. What earns a place here is a property that
  # regresses SILENTLY — every one of these keeps passing as a 200 while the thing it
  # describes has stopped being true, which is exactly what a baseline is for:
  #
  #   * X-Trace-Id is a frozen promise (contracts/README.md § "Trace correlation"), and a
  #     header that stops being sent breaks no test that does not look for it.
  #   * the ASGI span exclusion is one dependency bump away from silently reverting —
  #     `evidence/` in that change is the picture of what it looked like before.
  #   * a redaction regression puts real passwords in a store with a UI and an API, and
  #     nothing else in this repo would notice.
  #
  # ALL TAGGED `local`, carried across unchanged: there is no deployed Phoenix and no
  # deployed OTLP endpoint, so none of this is a claim about a remote origin.
  #
  # THE JAR ARRIVES HERE HOLDING THE KNOWLEDGE-BASE OWNER'S SESSION, and leaves empty —
  # `logout-the-dev-account` at the bottom is what makes that true. Before this block the
  # baseline ended signed in, which was accidental rather than decided; a change suite that
  # opens with an anonymous refusal (0004's did) depends on it being empty.
  #
  # NOT PROMOTED, and why: `stateless-chat-carries-a-trace-id-too` and
  # `the-stateless-trace-is-rooted-at-its-own-route` proved instrumentation covers more than
  # one router — `the-sign-in-trace-reached-phoenix` below is a different router and proves
  # the same thing for free. `phoenix-knows-the-backend-project` is implied by every
  # project-scoped query here, which 404s when the project is absent.


  # ─────────────────────────── what build is this, and what is it running (0006)
  # Promoted from changes/0006-chatbot-eval. The eval reads this endpoint to record what it
  # measured, so a regression here silently corrupts a permanent record of a score rather
  # than breaking a request — which is why these are worth keeping forever.
  #
  # Self-contained: its own account, its own logout, so it can sit anywhere in the file and
  # perturbs no other block's session.

  - name: version-requires-a-session
    owner: chatbot-backend
    GET: /api/v1/version
    # UNTAGGED, so it runs against a deployed origin too. Which build and which model an
    # environment runs is deployment information; /healthz already answers liveness for an
    # anonymous caller and this deliberately does not. Asserts a body property, not a bare
    # status — contracts/README.md § "Two origins, one suite".
    expect:
      status: 401
      json:
        error:
          code: AUTH_REQUIRED

  - name: register-a-version-reader
    owner: chatbot-backend
    POST: /api/v1/auth/register
    body:
      email: smoke-baseline-version-${SMOKE_RUN_ID}@auth.test
      password: ${SMOKE_PASSWORD}
      signup_code: ${SIGNUP_CODE}
      display_name: Version Reader
    expect:
      status: 201
      cookie: session

  - name: version-names-the-effective-chat-model
    owner: chatbot-backend
    GET: /api/v1/version
    # UNTAGGED. The enum is the assertion: free text would pass a presence check and tell a
    # reader of an experiment nothing. NOT asserted as `echo` — a developer or an
    # environment with credentials legitimately runs bedrock.
    expect:
      status: 200
      body_matches: '"chat_model":\s*"(echo|bedrock)"'

  - name: version-names-the-retrieval-configuration
    owner: chatbot-backend
    GET: /api/v1/version
    # UNTAGGED. These two decide what a retrieval measurement MEANS, so an experiment that
    # did not record them is not comparable with anything.
    expect:
      status: 200
      body_matches: '"embedding_model":\s*"(local|bedrock)".*"retrieval_router":\s*"(heuristic|llm)"'

  - name: version-leaks-no-credential
    owner: chatbot-backend
    GET: /api/v1/version
    # UNTAGGED, and the most valuable of the seven remotely: this endpoint exists to report
    # configuration, which is exactly the instruction under which a secret gets added later.
    # Written against field NAMES rather than values so it fails on the DAY one is added
    # rather than once it holds a real key. `body_matches` stops an empty body passing the
    # exclusion on its own.
    expect:
      status: 200
      body_matches: '"version"'
      body_excludes: '(?i)(secret|password|credential|signup_code|aws_access|session_token)'

  - name: version-reports-the-build-it-was-given
    owner: chatbot-backend
    GET: /api/v1/version
    # `local` ONLY: it asserts the value stack/dev.env passes in, and a deployed environment
    # has a different tag. The property is that the app reports what it was GIVEN — an
    # application that derives its own build identity is not reporting one.
    tags: [local]
    expect:
      status: 200
      json:
        image_tag: ${BACKEND_IMAGE_TAG}

  - name: the-backend-image-tag-is-a-version
    owner: chatbot-backend
    GET: /api/v1/version
    # `local` ONLY, same reason. Asserts the SHAPE rather than the value: `dev` satisfied
    # every other check for a month while making two builds indistinguishable.
    # docs/adr/0015.
    tags: [local]
    expect:
      status: 200
      body_matches: '"image_tag":\s*"local-[0-9]+\.[0-9]+\.[0-9]+"'

  - name: logout-the-version-reader
    owner: chatbot-backend
    POST: /api/v1/auth/logout
    # The jar's exit state is a decision, not an accident: the block that follows opens with
    # steps that assume nobody is signed in.
    expect:
      status: 204

  - name: phoenix-is-up
    owner: chatbot-backend
    GET: /healthz
    base: ${PHOENIX_BASE}
    contract: false
    tags: [local]
    expect:
      status: 200

  - name: register-a-trace-owner
    owner: chatbot-backend
    POST: /api/v1/auth/register
    tags: [local]
    body:
      email: smoke-baseline-trace-${SMOKE_RUN_ID}@auth.test
      password: ${SMOKE_PASSWORD}
      signup_code: ${SIGNUP_CODE}
      display_name: Trace Owner
    expect:
      status: 201
      cookie: session
    capture:
      # Deliberately not `account_id`/`thread_id`: `thread_id` is already captured further
      # up this file, and a promoted block that quietly rebinds an earlier suite's variable
      # is a trap for whoever adds a step between them.
      trace_account_id: user.id

  - name: start-a-chat-to-trace
    owner: chatbot-backend
    POST: /api/v1/threads
    tags: [local]
    body: {}
    expect:
      status: 201
    capture:
      trace_thread_id: thread.id

  - name: a-message-carries-a-trace-id
    owner: chatbot-backend
    POST: /api/v1/threads/${trace_thread_id}/messages
    tags: [local]
    body:
      message: "How many moons does Mars have?"
    # The frozen promise. 32 lowercase hex, anchored: a handler echoing a request header,
    # or writing a dashed UUID, satisfies a looser pattern and correlates with nothing.
    expect:
      status: 200
      headers:
        X-Trace-Id: '^[0-9a-f]{32}$'
    capture:
      chat_trace: header:X-Trace-Id

  - name: phoenix-has-the-chat-trace
    owner: chatbot-backend
    GET: /v1/projects/${PHOENIX_PROJECT_NAME}/spans?trace_id=${chat_trace}
    base: ${PHOENIX_BASE}
    contract: false
    tags: [local]
    retry: {attempts: 15, delay: 2.0}
    # The retries are the batch export's schedule, not flakiness insurance. Batch processors
    # are required — a synchronous one puts collector latency on the request path.
    expect:
      status: 200
      body_matches: '"trace_id":\s*"${chat_trace}"'

  - name: the-chat-trace-is-rooted-at-the-http-request
    owner: chatbot-backend
    GET: /v1/projects/${PHOENIX_PROJECT_NAME}/spans?trace_id=${chat_trace}&name=POST%20%2Fv1%2Fthreads%2F%7Bthread_id%7D%2Fmessages
    base: ${PHOENIX_BASE}
    contract: false
    tags: [local]
    retry: {attempts: 15, delay: 2.0}
    # Filtered server-side by name, so `parent_id: null` is about THAT span rather than
    # whichever one serialised first. The route template, not the concrete path — a span
    # named with the chat id in it makes every trace its own endpoint.
    expect:
      status: 200
      body_matches: '"parent_id":\s*null'

  - name: the-graph-run-is-nested-under-it
    owner: chatbot-backend
    GET: /v1/projects/${PHOENIX_PROJECT_NAME}/spans?trace_id=${chat_trace}&span_kind=CHAIN&name=LangGraph
    base: ${PHOENIX_BASE}
    contract: false
    tags: [local]
    retry: {attempts: 15, delay: 2.0}
    # By name: since 0008 the HTTP root of a chat turn is itself a CHAIN (tagged
    # `conversation`), so "no CHAIN at the root" would forbid it. Both clauses, and they need each other. A LangGraph run given its own tracer provider
    # returns nothing here; one instrumented without the FastAPI root returns a null parent.
    # Without `body_matches` the exclusion passes vacuously on an empty list.
    expect:
      status: 200
      body_matches: '"span_kind":\s*"CHAIN"'
      body_excludes: '"parent_id":\s*null'

  - name: one-request-draws-one-http-span
    owner: chatbot-backend
    GET: /v1/projects/${PHOENIX_PROJECT_NAME}/spans?trace_id=${chat_trace}&name=POST%20%2Fv1%2Fthreads%2F%7Bthread_id%7D%2Fmessages%20http%20receive&name=POST%20%2Fv1%2Fthreads%2F%7Bthread_id%7D%2Fmessages%20http%20send
    base: ${PHOENIX_BASE}
    contract: false
    tags: [local]
    retry: {attempts: 15, delay: 2.0}
    # The one most likely to regress without anybody touching this repo: an
    # opentelemetry-instrumentation-asgi bump that changes the `exclude_spans` default puts
    # four ASGI plumbing spans back into every trace. Asserting an EMPTY filtered list, and
    # the filter is proven live by the two steps above that return rows through it.
    expect:
      status: 200
      body_matches: '"data":\s*\[\s*\]'

  - name: the-root-span-names-the-account
    owner: chatbot-backend
    GET: /v1/projects/${PHOENIX_PROJECT_NAME}/spans?trace_id=${chat_trace}&attribute=user.id:${trace_account_id}
    base: ${PHOENIX_BASE}
    contract: false
    tags: [local]
    retry: {attempts: 15, delay: 2.0}
    # "Who made this call" — the id the API issued, filtered on server-side, and pinned to
    # the ROOT span. On a child only, it would pass a looser check while the span anybody
    # actually opens still could not answer the question.
    expect:
      status: 200
      body_matches: '"parent_id":\s*null'

  - name: the-root-span-names-the-chat
    owner: chatbot-backend
    GET: /v1/projects/${PHOENIX_PROJECT_NAME}/spans?trace_id=${chat_trace}&attribute=session.id:${trace_thread_id}
    base: ${PHOENIX_BASE}
    contract: false
    tags: [local]
    retry: {attempts: 15, delay: 2.0}
    # `session.id` is the OpenInference name, which is what makes a conversation's turns
    # group in Phoenix rather than showing as loose requests.
    expect:
      status: 200
      body_matches: '"parent_id":\s*null'

  - name: the-root-span-carries-the-request-body
    owner: chatbot-backend
    GET: /v1/projects/${PHOENIX_PROJECT_NAME}/spans?trace_id=${chat_trace}&name=POST%20%2Fv1%2Fthreads%2F%7Bthread_id%7D%2Fmessages
    base: ${PHOENIX_BASE}
    contract: false
    tags: [local]
    retry: {attempts: 15, delay: 2.0}
    # Filtered to the root span FIRST: the message also appears on the LangGraph spans, so
    # an unfiltered query passes with the HTTP span carrying nothing.
    expect:
      status: 200
      body_matches: 'How many moons does Mars have'

  - name: dev-account-signs-in
    owner: chatbot-backend
    POST: /api/v1/auth/login
    tags: [local]
    body:
      email: ${DEV_ACCOUNT_EMAIL}
      password: ${DEV_ACCOUNT_PASSWORD}
    # The standing account seeded at startup. The two values committed in stack/dev.env are
    # the two values that work — a backend that seeded a different password fails here
    # rather than at nine in the morning on somebody's machine.
    expect:
      status: 200
      cookie: session
      headers:
        X-Trace-Id: '^[0-9a-f]{32}$'
    capture:
      dev_trace: header:X-Trace-Id

  - name: dev-account-identifies
    owner: chatbot-backend
    GET: /api/v1/auth/me
    tags: [local]
    expect:
      status: 200
      json:
        user:
          email: ${DEV_ACCOUNT_EMAIL}

  - name: the-sign-in-trace-reached-phoenix
    owner: chatbot-backend
    GET: /v1/projects/${PHOENIX_PROJECT_NAME}/spans?trace_id=${dev_trace}&name=POST%20%2Fv1%2Fauth%2Flogin
    base: ${PHOENIX_BASE}
    contract: false
    tags: [local]
    retry: {attempts: 15, delay: 2.0}
    # Not a property anybody asked for — it is what makes the NEXT step mean something.
    # Asserting a password is absent from a store that has not received the login yet is a
    # pass that proves nothing, and it keeps passing right up until somebody looks.
    # It also covers a second router, which is why the two /v1/chat steps were not promoted.
    expect:
      status: 200
      body_matches: '"parent_id":\s*null'

  - name: no-credential-ever-reaches-a-span
    owner: chatbot-backend
    GET: /v1/projects/${PHOENIX_PROJECT_NAME}/spans?limit=1000
    base: ${PHOENIX_BASE}
    contract: false
    tags: [local]
    # Across the WHOLE project, not one trace: a redactor covering /v1/auth/login and
    # missing /v1/auth/register leaks just as completely, and only a project-wide look
    # catches it. `body_matches` keeps it honest — an empty project satisfies an exclusion.
    expect:
      status: 200
      body_matches: '"parent_id"'
      body_excludes: '(${DEV_ACCOUNT_PASSWORD}|${SMOKE_PASSWORD}|${SIGNUP_CODE})'

  - name: logout-the-dev-account
    owner: chatbot-backend
    POST: /api/v1/auth/logout
    tags: [local]
    # LAST, and it is about the file rather than about logout. The baseline used to end
    # signed in, by accident. Every change suite runs in the same process and inherits this
    # jar, so a suite opening with an anonymous refusal — the shape 0004 used — would assert
    # nothing. Leaving the jar empty makes that inheritance a decision.
    expect:
      status: 204


  # ───────────────────────────────────────── the proxy image and the deployed edge (0007)
  # Promoted from changes/0007-dev-environment. Last in the file and self-contained: its
  # own account, its own logout, so the jar ends empty in the remote pass as well.
  #
  # Tags re-judged, all carried: every `remote` here asserts a property only a deployed
  # edge holds — HSTS and a Secure cookie need HTTPS, the Host-forwarding CSRF seam needs
  # CloudFront, `bedrock` and a real reply need the deployed model, and Phoenix's own
  # origin with auth on exists only in `dev`. The header steps are untagged: the proxy
  # sets them on any origin, and remotely they also prove the edge does not strip them.

  - name: the-app-shell-carries-the-proxy-security-headers
    owner: frontend
    GET: /
    contract: false
    expect:
      status: 200
      body_matches: '<div id="root"'
      headers:
        x-content-type-options: '^nosniff$'
        referrer-policy: '^strict-origin-when-cross-origin$'

  - name: an-api-response-carries-the-proxy-security-headers
    owner: frontend
    GET: /api/healthz
    expect:
      status: 200
      headers:
        x-content-type-options: '^nosniff$'

  - name: the-origin-is-https-and-says-so
    owner: infra
    # HSTS comes from CloudFront's response headers policy; the local origin is plain http
    # and must stay that way (SESSION_COOKIE_SECURE=false).
    GET: /
    contract: false
    tags: [remote]
    expect:
      status: 200
      headers:
        strict-transport-security: 'max-age=[0-9]{7,}'

  - name: a-browser-shaped-register-is-accepted-through-the-edge
    owner: infra
    # The CSRF guard compares Origin with the host the backend sees. Through CloudFront
    # that holds only if the viewer's Host is forwarded; an edge that rewrites it refuses
    # every browser POST with 403 while every header-less client passes.
    POST: /api/v1/auth/register
    tags: [remote]
    headers:
      Origin: ${SMOKE_ORIGIN}
      Sec-Fetch-Site: same-origin
    body:
      email: smoke-baseline-edge-${SMOKE_RUN_ID}@auth.test
      password: "${SMOKE_PASSWORD}"
      signup_code: "${SIGNUP_CODE}"
      display_name: Smoke Dev Edge
    expect:
      status: 201

  - name: the-session-cookie-is-secure-over-https
    owner: infra
    POST: /api/v1/auth/login
    tags: [remote]
    headers:
      Origin: ${SMOKE_ORIGIN}
    body:
      email: smoke-baseline-edge-${SMOKE_RUN_ID}@auth.test
      password: "${SMOKE_PASSWORD}"
    expect:
      status: 200
      cookie: session
      headers:
        set-cookie: '(?i)session=[^;]+;.*\bsecure\b'

  - name: the-deployed-backend-reports-its-image-and-model
    owner: infra
    # A dev environment that quietly serves `echo` passes every other step.
    GET: /api/v1/version
    tags: [remote]
    expect:
      status: 200
      body_matches: '"image_tag":\s*"[0-9a-f]{12}"'
      json:
        chat_model: bedrock

  - name: the-deployed-model-answers
    owner: infra
    # Bedrock through the pod identity: the permission and the model id both have to be
    # right, and only a real reply proves it. `echo` would repeat the message.
    POST: /api/v1/chat
    tags: [remote]
    headers:
      Origin: ${SMOKE_ORIGIN}
    body:
      message: Reply with the single word pong.
    expect:
      status: 200
      body_excludes: 'Reply with the single word pong'

  - name: logout-the-edge-account
    owner: infra
    POST: /api/v1/auth/logout
    tags: [remote]
    headers:
      Origin: ${SMOKE_ORIGIN}
    expect:
      status: 204

  - name: the-phoenix-ui-is-served-over-https
    owner: infra
    base: ${INFRA_PHOENIX_BASE_URL}
    GET: /login
    contract: false
    tags: [remote]
    expect:
      status: 200
      headers:
        content-type: '^text/html'
        strict-transport-security: 'max-age=[0-9]{7,}'

  - name: the-phoenix-api-refuses-an-anonymous-caller
    owner: infra
    # Traces carry users' chat content. An exposed Phoenix with auth off answers 200.
    base: ${INFRA_PHOENIX_BASE_URL}
    GET: /v1/projects
    contract: false
    tags: [remote]
    expect:
      status: 401
