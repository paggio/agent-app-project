# Frozen interface. Owned by this repo; product repos consume it.
# Drafted with ./scripts/harvest-contract.py, then reviewed by hand —
# the draft comes from the implementation, the promise does not.
# Editing note: this file is rewritten on --write, so comments inside
# it do not survive. Durable guidance belongs in contracts/README.md.

openapi: 3.1.0
info:
  title: agent-app API
  version: 1.9.0
  description: Frozen HTTP contract between the backend and its consumers. Changes are made here only,
    in a dedicated commit, before any implementation.
servers:
- url: /api
  description: The single origin the browser uses. The proxy strips /api before forwarding, so every path
    below is written as the backend serves it. Same-origin by design — see the frontend's ADR 0001.
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: Liveness of the API
      description: Answers 200 as long as the API process is serving. Says nothing about its dependencies,
        so it is safe to poll and useless as a readiness gate for anything downstream.
      operationId: getHealth
      responses:
        '200':
          description: The API is serving.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/chat:
    post:
      tags:
      - chat
      summary: Send one message and get one reply
      description: 'Requires a session, and refuses before any model is invoked — an unauthenticated caller
        must cost nothing, because a reply is bought from a real provider. Conversationally stateless even
        so: no thread, no history, and the session identifies the caller without carrying any conversation
        state. Each call is independent and the caller keeps whatever state it needs. Anything conversational
        — threads, streaming, persistence — is a later, additive change and is NOT promised here.'
      operationId: postChat
      security:
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: The reply to this message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`) — absent, unknown, expired, or revoked
            by logout. The refusal carries no reply, because the provider was never called. A client should
            treat it the way it treats a 401 from /v1/auth/me — sign the user in — and not as a fault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body failed validation; `detail` lists what. Reachable only with a valid session
            — authentication is a gate in FRONT of validation, so an anonymous caller sending a malformed
            body gets 401 rather than 422.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/version:
    get:
      tags:
      - ops
      summary: What build this is, and what it is running
      description: 'Build identity and the effective model selectors, so a caller can record WHAT it
        measured by reading it rather than by being told. Requires a session: which image and which
        model an environment runs is deployment information, and /healthz already answers liveness for
        an anonymous caller. Every field is a selector or an identifier — never a credential, never a
        connection string, and never a wholesale dump of the settings object. Deliberately silent about
        retrieval TUNING (top-k, the score floor, the fusion weights): those are internals that must
        move freely, and promising them here would make them contract. See contracts/README.md
        section "What GET /v1/version promises".'
      operationId: getVersion
      security:
      - cookieAuth: []
      responses:
        '200':
          description: The build, and the configuration that decides what an answer is made of.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/register:
    post:
      tags:
      - auth
      summary: Create an account and sign in
      description: 'Creates an account and establishes a session in one call, so a caller never has to
        register and then log in. Gated by a shared signup code supplied to the deployment: without a
        matching code this endpoint behaves as if registration were closed. The code is checked BEFORE
        the email is looked up, so 409 is only reachable by a caller who already holds the code — that
        ordering is what keeps 409 from being an open account-enumeration oracle.'
      operationId: postAuthRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: The account was created and this response carries its session cookie.
          headers:
            Set-Cookie:
              description: The session cookie. Attributes are promised in contracts/README.md.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '403':
          description: The signup code was absent or wrong (`AUTH_SIGNUP_CLOSED`), or the request was
            cross-origin (`AUTH_CROSS_ORIGIN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An account already exists for this email (`AUTH_EMAIL_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body failed validation — including the password policy, which is enforced as
            validation and therefore reported in this shape rather than in the error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too many attempts from this caller (`AUTH_RATE_LIMITED`). `Retry-After` says when
            to try again.
          headers:
            Retry-After:
              description: Seconds until the next attempt is permitted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Exchange credentials for a session
      description: 'On success the response carries the session cookie and the identity it belongs to,
        so a caller needs no follow-up request to know who it is. Failure is deliberately uninformative:
        an unknown email and a wrong password return the identical status and code, so this endpoint cannot
        be used to discover which addresses have accounts.'
      operationId: postAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: The credentials matched and this response carries a session cookie.
          headers:
            Set-Cookie:
              description: The session cookie. Attributes are promised in contracts/README.md.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          description: The email and password do not match an account (`AUTH_BAD_CREDENTIALS`). Returned
            identically whether or not the email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The request was cross-origin (`AUTH_CROSS_ORIGIN`). Checked before the rate limiter,
            so a cross-site page cannot burn through someone else's attempt budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body failed validation; `detail` lists what.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too many attempts for this email or from this caller (`AUTH_RATE_LIMITED`).
          headers:
            Retry-After:
              description: Seconds until the next attempt is permitted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/logout:
    post:
      tags:
      - auth
      summary: End the current session
      description: 'Deletes the session server-side and clears the cookie. Idempotent and safe to call
        without a session: logging out twice, or logging out when never logged in, is 204 and not an error.
        Because the record is deleted rather than merely expired, the cookie is dead the instant this
        returns — there is no window in which a copied cookie still works.'
      operationId: postAuthLogout
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: There is no session now, whether or not there was one before.
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
        '403':
          description: The request was cross-origin (`AUTH_CROSS_ORIGIN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/auth/me:
    get:
      tags:
      - auth
      summary: Who the current session belongs to
      description: 'The endpoint a client calls on load to decide whether it is signed in. 401 here is
        a NORMAL state, not a fault — it is the answer "nobody", and a client must distinguish it from
        a transport failure, which means something entirely different to a user. Never mutates: this is
        a GET, and the CSRF posture in contracts/README.md depends on no GET mutating anything.'
      operationId: getAuthMe
      security:
      - cookieAuth: []
      responses:
        '200':
          description: The session is valid and belongs to this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`) — absent, unknown, or expired cookie.
            Expected and unremarkable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/threads:
    post:
      tags:
      - threads
      summary: Start a chat
      description: 'Creates an empty chat owned by the calling account. A title may be supplied, but is
        normally omitted: the server derives one from the first message, so a client never has to invent
        a title and two clients cannot derive different ones. Creating a chat invokes no model and costs
        nothing.'
      operationId: postThreadCreate
      security:
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
        required: false
      responses:
        '201':
          description: The chat was created and belongs to the calling account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`). Nothing was created — the gate is in
            front of the write, so a refusal never leaves a row behind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The request was cross-origin (`AUTH_CROSS_ORIGIN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body failed validation; `detail` lists what. Includes an `agents` entry the
            deployment does not run or the role may not use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - threads
      summary: The caller's chats
      description: 'Every chat owned by the calling account and no others, most recently active first.
        Scoped in the query rather than filtered afterwards, so this endpoint cannot leak another account''s
        titles. Capped at the 200 most recent, which is a deliberate omission of pagination rather than
        an oversight: a `cursor` parameter is additive when somebody actually has 200 chats. Returns an
        empty array for an account with none — that is a normal state, not a 404.'
      operationId: getThreadList
      security:
      - cookieAuth: []
      responses:
        '200':
          description: The caller's chats. Possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadListResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`). Not an empty list — a stranger is
            refused rather than told there is nothing here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/threads/{thread_id}:
    get:
      tags:
      - threads
      summary: One chat and its transcript
      description: 'The chat and its messages in the order they happened, read from storage — which is
        what makes a conversation survive a reload. Capped at the 500 most recent messages, same reasoning
        as the list cap. Never mutates: this is a GET, and the CSRF posture in contracts/README.md depends
        on no GET mutating anything, so reading a chat does not touch its `updated_at`.'
      operationId: getThread
      security:
      - cookieAuth: []
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The chat and its transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadDetailResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such chat for this account (`THREAD_NOT_FOUND`). Returned identically whether
            the chat never existed, was deleted, or belongs to somebody else — see contracts/README.md
            § "Chats, ownership and titles" for why this is not a 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - threads
      summary: Rename a chat
      description: 'Sets the title, replacing whatever was there — a derived one or an earlier chosen one.
        A chosen title is permanent: later messages never re-derive it, so a rename is not silently undone
        by continuing the conversation.'
      operationId: patchThread
      security:
      - cookieAuth: []
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameThreadRequest'
        required: true
      responses:
        '200':
          description: The chat as it now stands, with the new title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The request was cross-origin (`AUTH_CROSS_ORIGIN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such chat for this account (`THREAD_NOT_FOUND`), on the same terms as the GET
            above. A rename attempt is not an existence oracle either.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The title failed validation — empty, or over 200 characters. The policy is stated,
            so it is reported in this shape rather than in the error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - threads
      summary: Delete a chat
      description: 'Deletes the chat and its messages. A HARD delete: there is no archive, no trash and
        no undo, and a client must not present one. Not idempotent in the forgiving sense — deleting a
        chat that is already gone is the same 404 a stranger gets, because an endpoint that answered 204
        for a chat it cannot see would tell a caller which ids once existed.'
      operationId: deleteThread
      security:
      - cookieAuth: []
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The chat and its messages are gone.
        '401':
          description: There is no valid session (`AUTH_REQUIRED`). Nothing was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The request was cross-origin (`AUTH_CROSS_ORIGIN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such chat for this account (`THREAD_NOT_FOUND`). The chat is untouched — a
            refusal here must never be a delete that then reports itself missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/threads/{thread_id}/messages:
    post:
      tags:
      - threads
      summary: Send a message in a chat and get the reply
      description: 'Appends the message to the chat, answers it, and appends the reply — so the transcript
        is written by the server rather than assembled by a client. Unlike /v1/chat this is NOT stateless:
        the earlier turns of this chat are supplied to the model, bounded to a recent window, so a follow-up
        question works. Turns outside that window are not sent and are not summarised; contracts/README.md
        § "Chats, ownership and titles" states what that promises and what it does not. Rate limited per
        account, because history multiplies what one request costs. Answers complete; the same turn with
        progress events while it runs is postThreadMessageStream.'
      operationId: postThreadMessage
      security:
      - cookieAuth: []
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      responses:
        '200':
          description: The reply, the two turns just appended, and the chat as it now stands — whose title
            may have just been derived from this message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`). The refusal carries no reply, because
            the provider was never called, and appends nothing to the chat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The request was cross-origin (`AUTH_CROSS_ORIGIN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such chat for this account (`THREAD_NOT_FOUND`). Checked before any model is
            invoked, so sending into somebody else's chat costs nothing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body failed validation; `detail` lists what. Reachable only with a valid session
            for a chat the caller owns — both gates are in front of validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too many messages from this account (`AUTH_RATE_LIMITED`). `Retry-After` says when
            to try again. Present because a turn now carries history and therefore costs more than one
            message's worth of tokens.
          headers:
            Retry-After:
              description: Seconds until the next attempt is permitted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/threads/{thread_id}/messages/stream:
    post:
      tags:
      - threads
      summary: Send a message in a chat and watch the agents work
      description: 'The same turn as postThreadMessage — same body, same gates in the same order, same
        rate-limit bucket, same two messages appended — answered as `text/event-stream` so a client can
        show progress while it waits. Every refusal (401, 403, 404, 422, 429) is decided before the stream
        opens and is the same JSON response postThreadMessage gives. Once it opens the status is 200 and
        the events are, in order: zero or more `step` (data: StepEvent), then exactly one of `done` (data:
        SendMessageResponse — the stored turn, its `steps` included) or `error` (data: ErrorResponse — the
        turn failed and nothing was appended). A `:`-comment heartbeat is sent at least every 15 seconds.
        contracts/README.md § "Agent steps, progress and capabilities" is the normative version.'
      operationId: postThreadMessageStream
      security:
      - cookieAuth: []
      parameters:
      - name: thread_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
        required: true
      responses:
        '200':
          description: The stream opened. `step` events, then one `done` or one `error`.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: There is no valid session (`AUTH_REQUIRED`). No stream opens and nothing is appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The request was cross-origin (`AUTH_CROSS_ORIGIN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such chat for this account (`THREAD_NOT_FOUND`), checked before any model is
            invoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body failed validation; `detail` lists what.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too many messages from this account (`AUTH_RATE_LIMITED`) — the bucket
            postThreadMessage spends.
          headers:
            Retry-After:
              description: Seconds until the next attempt is permitted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/capabilities:
    get:
      tags:
      - auth
      summary: What this session may use and see
      description: 'The calling account''s role, the subagents (spokes) this deployment runs with each
        one''s tools, whether this role may use each, and what this role may see. Computed on the server
        from the role; a client renders it and decides nothing from it — enforcement is the server''s.
        Never mutates.'
      operationId: getCapabilities
      security:
      - cookieAuth: []
      responses:
        '200':
          description: The session's capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/documents:
    post:
      tags:
      - documents
      summary: Add a document to the caller's knowledge base
      description: 'Stores the original, splits it, indexes it, and returns when it is searchable — there
        is no pending state to poll through. The body carries the text directly: this milestone accepts
        UTF-8 text and markdown only, and there is no multipart upload. Content over the configured size
        limit and content types outside the accepted set are both 422, because both are stated policy;
        an account that has reached its document limit is a well-formed request refused, so it is 409.
        The limit is enforced before anything is stored or indexed, so a refusal costs nothing. See
        contracts/README.md § "Documents, the knowledge base, and what a citation promises".'
      operationId: createDocument
      security:
      - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateDocumentUpload'
        required: true
      responses:
        '201':
          description: The document as stored, already searchable. `chunk_count` is how many pieces it
            was split into and is at least 1; `summary` is the one line the server derived, which is what
            the retrieval decision is made against.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`). Nothing is stored and nothing is indexed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The request was cross-origin (`AUTH_CROSS_ORIGIN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: This account already holds as many documents as it may (`DOCUMENT_QUOTA_EXCEEDED`).
            Well-formed and refused, which is why it is the error envelope rather than a validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body failed validation; `detail` lists what. Content larger than the limit and
            a content type outside the accepted set both land here, because both are stated policy — the
            same rule that puts the password policy in 422.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Too many uploads from this account (`AUTH_RATE_LIMITED`). `Retry-After` says when
            to try again. Present because ingest buys embeddings.
          headers:
            Retry-After:
              description: Seconds until the next attempt is permitted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - documents
      summary: The caller's documents
      description: Every document this account owns and no others, most recently added first, capped at
        200. An empty array is a normal state, not a 404. The cap is a deliberate omission of pagination;
        a cursor is additive when somebody actually has 200 documents. Scoped in the query that finds them,
        never filtered afterwards.
      operationId: listDocuments
      security:
      - cookieAuth: []
      responses:
        '200':
          description: The account's documents, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/documents/{document_id}:
    get:
      tags:
      - documents
      summary: One document's record
      description: Metadata only — the stored text is served by the /content path below. A document owned
        by another account, one that was deleted, one that never existed and a malformed id all answer
        404 identically; contracts/README.md says why, and it is the same reasoning that governs chats.
      operationId: getDocument
      security:
      - cookieAuth: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The document as stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such document for this account (`DOCUMENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - documents
      summary: Remove a document from the knowledge base
      description: A hard delete, and it takes all three copies with it — the record, the stored original,
        and every indexed piece. No archive, no trash, no undo. Deleting an already-deleted document is
        the same 404 a stranger gets, not a forgiving 204. Citations already written into a transcript
        are NOT affected; they carry the document's name as a snapshot and keep it.
      operationId: deleteDocument
      security:
      - cookieAuth: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Gone. No body.
        '401':
          description: There is no valid session (`AUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The request was cross-origin (`AUTH_CROSS_ORIGIN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such document for this account (`DOCUMENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/documents/{document_id}/content:
    get:
      tags:
      - documents
      summary: The stored original, byte for byte
      description: 'Serves what was uploaded, from the object store, with the content type it was uploaded
        as. This path exists because the search index is DERIVED data: it can be rebuilt, and rebuilding
        it must never require anyone to upload anything again. A consumer may use it to show the source
        behind a citation. Scoped by account exactly as the metadata path is.'
      operationId: getDocumentContent
      security:
      - cookieAuth: []
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The original content, with the content type it was stored under.
          content:
            text/plain:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: There is no valid session (`AUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such document for this account (`DOCUMENT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/calls:
    get:
      tags:
      - calls
      summary: The most recent call-centre calls
      description: Calls the call worker has indexed and that are inside the retention window, most recently
        ENDED first, capped at 50. Metadata only — the transcript is on the detail path. Calls are
        organisation data, not an account's own, so every signed-in account sees the same list;
        contracts/README.md § "Call-centre calls" says why and what that costs. An empty array is a normal
        state, not a 404.
      operationId: listCalls
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Up to 50 calls, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallListResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/calls/{call_id}:
    get:
      tags:
      - calls
      summary: One call, with its whole transcript
      description: The latest event received for this call_id, as indexed. A call_id never received, one past
        retention, one that was refused at ingest and a malformed id all answer 404 identically.
      operationId: getCall
      security:
      - cookieAuth: []
      parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallResponse'
        '401':
          description: There is no valid session (`AUTH_REQUIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such call inside the retention window (`CALL_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: An opaque server-side session id. Carries no claims and means nothing without the
        server's record, which is what makes logout immediate and revocation real.
  schemas:
    AgentStep:
      properties:
        id:
          type: string
          description: Unique within its turn. Opaque.
        kind:
          type: string
          enum:
          - route
          - retrieval
          - tool
          - answer
          description: '`route` the coordinator choosing a spoke, `retrieval` a spoke gathering what the
            model will see, `tool` a tool the answering agent called, `answer` the model writing the reply.
            A consumer must tolerate a value it does not know.'
        agent:
          type: string
          description: Who ran it — `coordinator`, or a spoke name as in `Message.route`.
        name:
          type: string
          description: '`coordinate` for a route step, `answer` for an answer step, otherwise the tool''s
            name exactly as `CapabilitiesResponse` lists it under this agent.'
        label:
          type: string
          description: A short title for a person, e.g. "Choosing a specialist".
        summary:
          type: string
          description: 'One sentence for a person saying what happened, written by the server — e.g. "Sent
            to calls: the message names CALL-…", "Found 3 calls". Empty while running is allowed. Never
            carries credentials, SQL or another account''s data.'
        status:
          type: string
          enum:
          - running
          - ok
          - error
          description: '`running` appears only in a `started` StepEvent; a stored step is `ok` or `error`.'
        started_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
          description: Absent while running.
      type: object
      required:
      - id
      - kind
      - agent
      - name
      - label
      - summary
      - status
      - started_at
      title: AgentStep
      description: One step an agent took to produce an assistant turn.
    StepEvent:
      properties:
        phase:
          type: string
          enum:
          - started
          - completed
        step:
          $ref: '#/components/schemas/AgentStep'
      type: object
      required:
      - phase
      - step
      title: StepEvent
      description: The data of a `step` event on postThreadMessageStream. Every step is `started` before
        it is `completed`, under the same `id`; the completed steps, in order, are the stored `steps`.
    ToolCapability:
      properties:
        name:
          type: string
          description: Stable identifier; what `AgentStep.name` carries.
        label:
          type: string
        description:
          type: string
        allowed:
          type: boolean
          description: Whether this session's role may have this tool used on its behalf.
      type: object
      required:
      - name
      - label
      - description
      - allowed
      title: ToolCapability
    AgentCapability:
      properties:
        name:
          type: string
          description: The spoke, as in `Message.route`. A consumer must tolerate a value it does not know.
        label:
          type: string
        description:
          type: string
        allowed:
          type: boolean
          description: Whether the coordinator may route this session's turns here. `general` is always
            allowed.
        tools:
          items:
            $ref: '#/components/schemas/ToolCapability'
          type: array
          description: Possibly empty — `general` has none.
      type: object
      required:
      - name
      - label
      - description
      - allowed
      - tools
      title: AgentCapability
    CapabilitiesResponse:
      properties:
        role:
          type: string
          description: The account's role, as `User.role`.
        agents:
          items:
            $ref: '#/components/schemas/AgentCapability'
          type: array
          description: Every spoke this deployment runs, allowed or not, in a stable order.
        visibility:
          $ref: '#/components/schemas/Visibility'
      type: object
      required:
      - role
      - agents
      - visibility
      title: CapabilitiesResponse
      description: Response body for getCapabilities.
    Visibility:
      properties:
        steps:
          type: boolean
          description: Whether this role sees agent steps — `Message.steps` and `step` events. False means
            both are absent, not empty.
      type: object
      required:
      - steps
      title: Visibility
    AuthError:
      properties:
        code:
          type: string
          description: 'A stable machine-readable reason. Known values: AUTH_REQUIRED, AUTH_BAD_CREDENTIALS,
            AUTH_EMAIL_TAKEN, AUTH_SIGNUP_CLOSED, AUTH_CROSS_ORIGIN, AUTH_RATE_LIMITED, THREAD_NOT_FOUND,
            DOCUMENT_NOT_FOUND, DOCUMENT_QUOTA_EXCEEDED, CALL_NOT_FOUND.
            The last four are not about auth at all; this schema keeps its name for the ordinary reason
            that renaming it would change a generated type name in every consumer for no wire benefit.
            Consumers MUST
            tolerate an unknown code by falling back to `message` — codes are added additively and a
            client that switches exhaustively on this will break.'
        message:
          type: string
          description: Human-readable and safe to show a user. Never names which half of a credential
            pair was wrong, and never echoes the password.
      type: object
      required:
      - code
      - message
      title: AuthError
      description: 'One semantic failure: why, in a form both code and people can read.'
    Call:
      allOf:
      - $ref: '#/components/schemas/CallSummary'
      - type: object
        properties:
          tags:
            type: array
            items:
              type: string
          transcript:
            type: array
            items:
              $ref: '#/components/schemas/CallTurn'
            description: The whole call, in spoken order, exactly as the latest event carried it.
        required:
        - tags
        - transcript
      title: Call
      description: One call and its transcript. Fields mirror contracts/events/call-completed.v1.schema.json;
        the event is the source, this is the indexed copy.
    CallCitation:
      properties:
        marker:
          type: integer
          minimum: 1
          description: 1-based within THIS message's call_citations, contiguous, and what the reply's text
            refers to as `[1]`. Same rules as Citation.marker.
        call_id:
          type: string
          description: The call this came from. May since have passed retention, in which case the detail
            path answers 404 — a consumer must handle that.
        started_at:
          type: string
          format: date-time
        queue:
          type: string
        agent_name:
          type: string
          description: A snapshot taken when the answer was written, like Citation.filename.
        snippet:
          type: string
          description: Transcript text that was put in front of the model, truncated for display.
      type: object
      required:
      - marker
      - call_id
      - started_at
      - queue
      - agent_name
      - snippet
      title: CallCitation
      description: One call supplied to the model for one answer, and AT MOST ONE PER CALL per message.
        Says the model was GIVEN this text, never that it used it — the same promise Citation makes.
    MetricCitation:
      properties:
        marker:
          type: integer
          minimum: 1
          description: 1-based within THIS message's metric_citations, contiguous. Same rules as
            Citation.marker.
        project:
          type: string
          description: The semantic project that answered, e.g. `olist` or `funnel`.
        metric:
          type: string
          description: The first metric the query asked for — the one the answer is about.
        metrics:
          type: array
          items:
            type: string
          description: Every metric the query asked for, `metric` first.
        saved_query:
          anyOf:
          - type: string
          - type: 'null'
          description: The saved query that was run, or null for an ad-hoc metric query.
        label:
          type: string
          description: The metric's human label, a snapshot.
        definition:
          type: string
          description: The metric's readable definition at `sha`, a snapshot — e.g. "sum of item price
            over delivered orders".
        sha:
          type: string
          pattern: ^[0-9a-f]{40}$
          description: The semantic release that answered. A snapshot, never re-resolved.
        group_by:
          type: array
          items:
            type: string
        filters:
          type: array
          items:
            type: string
          description: The filters applied, rendered for a reader, e.g. "customer__state = 'SP'".
        start:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        end:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        result:
          $ref: '#/components/schemas/MetricResult'
      type: object
      required:
      - marker
      - project
      - metric
      - metrics
      - saved_query
      - label
      - definition
      - sha
      - group_by
      - filters
      - start
      - end
      - result
      title: MetricCitation
      description: One governed query whose result was supplied to the model, one per query per
        message. Every number in a metrics answer comes from one of these, and the citation carries
        its definition and release so the number can be read for what it is.
    MetricResult:
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              anyOf:
              - type: string
              - type: number
              - type: boolean
              - type: 'null'
          maxItems: 50
          description: At most 50 rows, in the query's order.
        row_count:
          type: integer
          minimum: 0
          description: Rows the query returned, before the 50-row cut.
        truncated:
          type: boolean
          description: True exactly when row_count is greater than the rows carried.
      type: object
      required:
      - columns
      - rows
      - row_count
      - truncated
      title: MetricResult
    CallListResponse:
      properties:
        calls:
          type: array
          items:
            $ref: '#/components/schemas/CallSummary'
      type: object
      required:
      - calls
      title: CallListResponse
    CallResponse:
      properties:
        call:
          $ref: '#/components/schemas/Call'
      type: object
      required:
      - call
      title: CallResponse
    CallSummary:
      properties:
        call_id:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        direction:
          type: string
          enum:
          - inbound
          - outbound
        queue:
          type: string
          description: Known values are listed in the event schema; a consumer must tolerate an unknown one.
        agent:
          $ref: '#/components/schemas/CallParty'
        customer:
          $ref: '#/components/schemas/CallParty'
        language:
          type: string
        outcome:
          type: string
          description: Known values are listed in the event schema; a consumer must tolerate an unknown one.
        csat:
          anyOf:
          - type: integer
          - type: 'null'
        turn_count:
          type: integer
          minimum: 1
        indexed_at:
          type: string
          format: date-time
          description: When the latest event for this call became searchable.
      type: object
      required:
      - call_id
      - started_at
      - ended_at
      - direction
      - queue
      - agent
      - customer
      - language
      - outcome
      - csat
      - turn_count
      - indexed_at
      title: CallSummary
      description: A call's metadata, without its transcript.
    CallParty:
      properties:
        id:
          type: string
        name:
          anyOf:
          - type: string
          - type: 'null'
          description: Null when the event carried none. Never a phone number.
      type: object
      required:
      - id
      - name
      title: CallParty
    CallTurn:
      properties:
        speaker:
          type: string
          enum:
          - agent
          - customer
        text:
          type: string
        offset_s:
          anyOf:
          - type: number
          - type: 'null'
      type: object
      required:
      - speaker
      - text
      - offset_s
      title: CallTurn
    ChatRequest:
      properties:
        message:
          type: string
          maxLength: 8000
          minLength: 1
          description: The user's message. 1-8000 characters.
      type: object
      required:
      - message
      title: ChatRequest
      description: Request body for postChat. Unknown fields are ignored rather than rejected, so a caller
        may send fields a given version does not yet know about.
    ChatResponse:
      properties:
        reply:
          type: string
          description: The assistant's reply, complete and unstreamed.
      type: object
      required:
      - reply
      title: ChatResponse
      description: Response body for postChat.
    Citation:
      properties:
        marker:
          type: integer
          minimum: 1
          description: A 1-based number identifying this source within THIS message's citation list. The
            reply's own text refers to it as `[1]`, `[2]` and so on, so a consumer rendering the sources
            should show this number. Markers are assigned per message and are not stable across messages.
            A reply produced by a model that emits no markers still carries a complete citation list —
            the list is the promise, the inline markers are a convenience.
        document_id:
          type: string
          description: The document this came from, so a consumer can link to it. Unique within
            one message's citation list. The document may since
            have been DELETED, in which case every document path answers 404 for this id — a consumer
            must handle that rather than assume the link resolves.
        filename:
          type: string
          description: The document's name AS IT WAS when this answer was written — a snapshot, not a
            lookup. This is what lets a transcript keep naming its sources after the knowledge base has
            moved on, and it is why a citation never becomes a hole.
        chunk_index:
          type: integer
          minimum: 0
          description: Which piece of the document was supplied, counting from 0 — the
            highest-scoring one when several matched. How a document is split is not promised and
            will change, so this is useful for showing "one part of a longer document" and not for
            addressing anything.
        snippet:
          type: string
          description: The text that was actually put in front of the model, truncated for display. Safe
            to show; it is the caller's own uploaded content.
      type: object
      required:
      - marker
      - document_id
      - filename
      - chunk_index
      - snippet
      title: Citation
      description: 'One source supplied to the model for one answer, and AT MOST ONE PER DOCUMENT
        per message — several matching chunks of one file are one source, not several. Read the
        rest of the promise precisely: a citation says this text WAS GIVEN to the model, not that
        the model demonstrably used it. Nothing in this contract can certify the second, and a
        consumer must not phrase it as proof.'
    CreateDocumentRequest:
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: What to call it. Shown to the person and snapshotted onto every citation, so it is
            worth being a real name. Not a path, and not unique — uploading the same file twice makes two
            documents.
        content_type:
          type: string
          enum:
          - text/plain
          - text/markdown
          description: 'The accepted set for this version, and it is exhaustive. Anything else is a 422.
            Binary formats are a later change: extraction quality decides retrieval quality, so a PDF path
            needs its own criteria rather than a new enum value.'
        content:
          type: string
          minLength: 1
          description: The document itself, as UTF-8 text. There is no multipart upload; a client reads the
            file and sends it here. Size is bounded by the deployment's configured limit and measured on
            THIS field after decoding — not on the whole request — so the limit does not depend on how long
            somebody named their file.
      type: object
      required:
      - filename
      - content_type
      - content
      title: CreateDocumentRequest
      description: Request body for createDocument.
    CreateDocumentUpload:
      properties:
        file:
          type: string
          format: binary
          description: 'The document itself. This is the intake for anything that is not UTF-8
            text — a PDF, today. Sending a PDF as text through the JSON intake corrupts it,
            and there is no base64 field on purpose: at this size limit a base64 body is a
            third larger and has to be decoded in memory before it can be refused.'
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Optional. Defaults to the uploaded part's own filename. Same meaning as
            on the JSON intake — shown to the person, and snapshotted onto every citation.
      type: object
      required:
      - file
      title: CreateDocumentUpload
      description: 'Request body for createDocument as multipart/form-data. The content type is
        taken from the uploaded part, and must be one the deployment accepts: `application/pdf`
        today. Text and markdown use the JSON intake instead.'
    CreateThreadRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          description: 'Optional, and explicitly nullable — omitting it and sending null are both accepted
            and mean the same thing. Normally omitted: the server derives a title from the first message,
            so supplying one here is for a client that already knows what the chat is about.'
        agents:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          description: 'The agents this chat may use, by `AgentCapability.name`. Omitted or null means every
            agent the role may use. `general` is always included, listed or not. A name the deployment
            does not run, or the role may not use, is a 422 and nothing is created. Fixed at creation:
            no endpoint changes it — see contracts/README.md § "Agent steps, progress and capabilities".'
      type: object
      title: CreateThreadRequest
      description: Request body for postThreadCreate, and the whole body is optional. Unknown fields are
        ignored rather than rejected.
    Document:
      properties:
        id:
          type: string
          description: Opaque and stable. Appears in citations and in URLs.
        filename:
          type: string
          description: As supplied at upload. Not unique within an account.
        content_type:
          type: string
          description: As supplied at upload, from the accepted set.
        byte_size:
          type: integer
          minimum: 0
          description: The size of the stored content in bytes, decoded — the same number the size limit
            is applied to.
        chunk_count:
          type: integer
          minimum: 1
          description: How many pieces the document was split into for retrieval. At least 1 for a ready
            document; a ready document that indexed nothing could never be returned by a search. How the
            splitting works is NOT promised and will change.
        summary:
          type: string
          description: One line describing what this document is about, derived by the server at upload.
            It is not decoration — it is what the retrieval decision is made against, so it is exposed so
            a person can see what the assistant thinks they uploaded. How it is derived is not promised.
        status:
          type: string
          enum:
          - ready
          - failed
          description: 'Ingest is synchronous in this version, so a document that answers 201 is already
            `ready`. The field exists anyway: it is what lets a later version add `pending` or `indexing`
            additively instead of reshaping this schema. A consumer must tolerate an unknown value.'
        created_at:
          type: string
          format: date-time
          description: When it was added.
        updated_at:
          type: string
          format: date-time
          description: When the record last changed. Reading a document does not touch it — no GET mutates
            anything, which is the invariant the whole CSRF posture rests on.
      type: object
      required:
      - id
      - filename
      - content_type
      - byte_size
      - chunk_count
      - summary
      - status
      - created_at
      - updated_at
      title: Document
      description: One document in an account's knowledge base. The record and the stored original are the
        system of record; the search index is derived from them and can be rebuilt.
    DocumentListResponse:
      properties:
        documents:
          items:
            $ref: '#/components/schemas/Document'
          type: array
          description: Newest first, capped at 200. Empty is normal.
      type: object
      required:
      - documents
      title: DocumentListResponse
      description: Response body for listDocuments.
    DocumentResponse:
      properties:
        document:
          $ref: '#/components/schemas/Document'
      type: object
      required:
      - document
      title: DocumentResponse
      description: Response body for createDocument and getDocument.
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/AuthError'
      type: object
      required:
      - error
      title: ErrorResponse
      description: 'The envelope for semantic failures — 401, 403, 409, 429. Validation failures do NOT
        use it: they keep the framework''s 422 `detail` shape, already frozen for /v1/chat. One rule
        decides which: 422 means the request was malformed or violated a stated policy, this envelope
        means the request was well-formed and refused.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
      type: object
      title: HTTPValidationError
      description: Returned with 422 when the request body is not valid.
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
      type: object
      required:
      - status
      title: HealthResponse
      description: Response body for getHealth.
    IdentityResponse:
      properties:
        user:
          $ref: '#/components/schemas/User'
      type: object
      required:
      - user
      title: IdentityResponse
      description: 'Returned by register, login and me alike, so all three answer "who am I" in one shape
        and a client needs one parser. Nested rather than flat to leave room for session metadata — an
        expiry, a device list — to arrive additively under its own key.'
    LoginRequest:
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 3
          description: Compared case-insensitively after trimming, so Foo@Example.com and foo@example.com
            are the same account.
        password:
          type: string
          maxLength: 128
          minLength: 1
          description: Not length-validated against the policy here — an existing account whose password
            predates a policy change must still be able to sign in.
      type: object
      required:
      - email
      - password
      title: LoginRequest
      description: Request body for postAuthLogin. Unknown fields are ignored rather than rejected.
    Message:
      properties:
        id:
          type: string
          description: Opaque and stable. Addressable so a client can key a list on it, not because
            anything may be done to one message — there is no endpoint that edits or deletes a single
            message.
        role:
          type: string
          enum:
          - user
          - assistant
          description: Who said it. Two values, and a third would be a contract change rather than a
            surprise — so a consumer may switch exhaustively on THIS field, unlike `AuthError.code`.
        content:
          type: string
          description: What was said, complete. The assistant's turns are stored exactly as they were
            returned.
        created_at:
          type: string
          format: date-time
          description: When it was stored. Ordering within a chat is by the order the server assigned,
            not by comparing these — two turns in the same millisecond still read back in the order they
            happened.
        retrieval_consulted:
          type: boolean
          description: 'Whether the knowledge base was consulted while producing THIS turn. Meaningful only
            on an assistant turn. ABSENT is a real and common state: every message stored before knowledge
            bases existed has neither this field nor `citations`, so a consumer must treat absence as "not
            applicable" rather than as false. True with an empty `citations` means the assistant looked and
            found nothing relevant, which is a different fact from not having looked.'
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
          description: The sources supplied to the model for this turn, in marker order. Present only on
            assistant turns that had any. Each entry names its document as it was AT THE TIME, so this list
            keeps meaning after a document is deleted.
        route:
          type: string
          enum:
          - documents
          - calls
          - general
          - metrics
          description: 'Which spoke the coordinator sent THIS turn to: the caller''s own documents, the
            call-centre calls, a plain conversation, or the governed metrics. Assistant turns only. ABSENT on every turn stored
            before the coordinator existed, which a consumer must treat as "not applicable". A consumer
            must tolerate a value it does not know: spokes are added additively. Exactly one spoke
            answers a turn.'
        call_citations:
          items:
            $ref: '#/components/schemas/CallCitation'
          type: array
          description: The calls supplied to the model for this turn, in marker order. Present only on
            assistant turns routed to `calls`; on those, `citations` is empty and `retrieval_consulted` is
            false, because the knowledge base was not consulted.
        metric_citations:
          items:
            $ref: '#/components/schemas/MetricCitation'
          type: array
          description: The governed metric queries whose results were supplied to the model for this
            turn, in marker order. Present only on assistant turns routed to `metrics`; on those,
            `citations` and `call_citations` are empty. An empty list on a `metrics` turn means no
            governed metric answers the question.
        steps:
          items:
            $ref: '#/components/schemas/AgentStep'
          type: array
          description: 'The steps the agents took to produce THIS turn, in the order they ran: a `route`
            step first and an `answer` step last. Assistant turns only. ABSENT on turns stored before steps
            existed and whenever the caller''s role may not see steps (`Visibility.steps`); a consumer must
            treat absence as "not available".'
      type: object
      required:
      - id
      - role
      - content
      - created_at
      title: Message
      description: One turn in a chat. `retrieval_consulted`, `citations`, `route`, `call_citations`,
        `metric_citations` and `steps` are additive and optional — an assistant turn from before they existed carries none of them.
    RegisterRequest:
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 3
          description: Normalised by trimming and lower-casing before storage and uniqueness are decided.
        password:
          type: string
          maxLength: 128
          minLength: 12
          description: 12-128 characters after NFKC normalisation. No composition rules — no required
            digit, symbol or mixed case — because they shrink the real search space rather than growing
            it. Rejected if it appears in the deployment's common-password list.
        signup_code:
          type: string
          minLength: 1
          description: The deployment's shared signup code. Absent or wrong is 403, not 422 — a closed
            door is a refusal, not a malformed request.
        display_name:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
          - type: 'null'
          description: Optional, and explicitly nullable — omitting it and sending null are both accepted
            and mean the same thing. Defaults to the part of the email before the @, because clients need
            something to render and an empty name is not one.
      type: object
      required:
      - email
      - password
      - signup_code
      title: RegisterRequest
      description: Request body for postAuthRegister. Unknown fields are ignored rather than rejected.
    RenameThreadRequest:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          description: 'The new title, 1-200 characters after trimming. Required and not nullable: clearing
            a title is not a thing a caller can do, because a chat with no title is not something a client
            can render.'
      type: object
      required:
      - title
      title: RenameThreadRequest
      description: Request body for patchThread. Unknown fields are ignored rather than rejected, so this
        can grow into a general chat-update body additively.
    SendMessageRequest:
      properties:
        message:
          type: string
          maxLength: 8000
          minLength: 1
          description: The user's message. 1-8000 characters — deliberately the same bounds ChatRequest
            declares, so moving a client from /v1/chat to a chat changes where it posts and nothing else.
      type: object
      required:
      - message
      title: SendMessageRequest
      description: Request body for postThreadMessage. Unknown fields are ignored rather than rejected.
    SendMessageResponse:
      properties:
        reply:
          type: string
          description: The assistant's reply, complete and unstreamed. Exactly the `content` of the last
            entry in `messages`, present because it is what every consumer wants and because it keeps the
            shape recognisable to a client coming from ChatResponse.
        thread:
          $ref: '#/components/schemas/Thread'
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          description: The two turns just appended, the user's first. Returned rather than left to be
            re-fetched so a client can render the exchange without a second request, and so the ids and
            timestamps it renders are the server's rather than invented.
      type: object
      required:
      - reply
      - thread
      - messages
      title: SendMessageResponse
      description: 'Response body for postThreadMessage. Carries the chat as well as the turns, because
        this request may have changed it: the title is derived from the first message, so the chat a client
        holds is stale the moment the first reply arrives.'
    Thread:
      properties:
        id:
          type: string
          description: Opaque and stable for the life of the chat. Not a row number — nothing may be
            inferred from its shape, and it appears in a URL a person can see.
        title:
          type: string
          description: Always present and never empty. Derived from the first message when nobody has
            chosen one; a chosen one is permanent. How it is derived is not promised.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 'When the chat last CHANGED — a message appended, or a rename. Not when it was last
            read: no GET mutates state, so opening a chat does not move this.'
        message_count:
          type: integer
          description: How many messages the chat holds. Present so a client can render a list without
            fetching every transcript, and it counts what is stored rather than what a capped read
            returned.
        agents:
          items:
            type: string
          type: array
          description: The agents this chat may use, chosen at creation and never changed, in the order
            `getCapabilities` lists them. Always contains `general`. A chat created before this field
            existed carries every agent the role may use.
      type: object
      required:
      - id
      - title
      - created_at
      - updated_at
      - message_count
      - agents
      title: Thread
      description: A chat, as its owner sees it. Contains no account id — a caller only ever sees its own,
        so naming the owner would add a field that is always the caller and could only ever leak.
    ThreadDetailResponse:
      properties:
        thread:
          $ref: '#/components/schemas/Thread'
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          description: The transcript in the order it happened, oldest first, capped at the 500 most recent.
            `thread.message_count` is the true total, so a client can tell a capped read from a complete
            one.
      type: object
      required:
      - thread
      - messages
      title: ThreadDetailResponse
      description: Response body for getThread — the chat and its transcript in one round trip, because
        a client that has one always wants the other.
    ThreadListResponse:
      properties:
        threads:
          items:
            $ref: '#/components/schemas/Thread'
          type: array
          description: Most recently active first, capped at 200. Empty for an account with no chats,
            which is a normal state and not an error.
      type: object
      required:
      - threads
      title: ThreadListResponse
      description: 'Response body for getThreadList. Nested under a key rather than a bare array for the
        reason IdentityResponse is: it leaves room for a cursor or a total to arrive additively.'
    ThreadResponse:
      properties:
        thread:
          $ref: '#/components/schemas/Thread'
      type: object
      required:
      - thread
      title: ThreadResponse
      description: Response body for postThreadCreate and patchThread. One shape for both, so a client
        needs one parser for "here is a chat".
    User:
      properties:
        id:
          type: string
          description: Opaque and stable for the life of the account. Not an email, not a row number —
            nothing may be inferred from its shape.
        email:
          type: string
          format: email
          description: The normalised form, so it is what a client should display and compare.
        display_name:
          type: string
          description: Always present and never empty. Derived from the email when none was given.
        role:
          type: string
          description: 'What this account may use and see, resolved by getCapabilities. Every account is
            `member` today; other values arrive additively, so a consumer must tolerate one it does not know
            and must never decide permissions from it.'
      type: object
      required:
      - id
      - email
      - display_name
      title: User
      description: An account, as its own session may see it. Contains no password material, no hash,
        no session id and no timestamps — a field is added here only when a consumer needs it.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
        msg:
          type: string
        type:
          type: string
        input: {}
        ctx:
          type: object
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
      description: 'One validation problem: where it was, and what was wrong.'
    VersionResponse:
      properties:
        version:
          type: string
          description: The application's own version — the release, not the build. Two containers built
            from different commits can report the same one, which is why image_tag exists.
        image_tag:
          anyOf:
          - type: string
          - type: 'null'
          description: The container image tag, supplied to the process from OUTSIDE the image. NULL
            when nothing supplied one, and null is the correct answer rather than a fallback — an
            application that derives its own build identity from its version, its git tree or its
            hostname is not reporting one, and the fallback would read as true in every deployed
            environment. A consumer recording what it measured must treat null as "unknown", never as
            a value.
        git_sha:
          anyOf:
          - type: string
          - type: 'null'
          description: The commit the image was built from, supplied from outside the image, or null.
            Same rule as image_tag.
        chat_model:
          type: string
          enum:
          - echo
          - bedrock
          description: Which chat model is injected into the graph, as it is EFFECTIVELY configured
            rather than as a default. `echo` replies with the caller's own message and costs nothing;
            `bedrock` calls a real provider. A consumer may switch exhaustively on this, and a third
            value would be a contract change rather than a surprise.
        chat_model_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The provider's model identifier when one is in use, and NULL under `echo`,
            because there is no model. Its shape is the provider's and nothing may be inferred from it.
        embedding_model:
          type: string
          enum:
          - local
          - bedrock
          description: Which embedder indexed the knowledge base and answers a dense query. It changes
            what a retrieval measurement means, so a consumer comparing two measurements must compare
            this too.
        retrieval_router:
          type: string
          enum:
          - heuristic
          - llm
          description: How the coordinator chooses a turn's spoke (and so whether the knowledge base is
            consulted) — by lexical rules over the message and the corpus manifest, or by asking the model. Promised because it is a behavioural MODE
            rather than a tuning value. A routing figure produced under one and a routing figure
            produced under the other are not the same measurement.
      type: object
      required:
      - version
      - image_tag
      - git_sha
      - chat_model
      - chat_model_id
      - embedding_model
      - retrieval_router
      title: VersionResponse
      description: 'Response body for getVersion. Every field is REQUIRED and four of them are
        nullable: a consumer must always be able to ask "what was this?" and get an explicit answer,
        including the explicit answer "nothing supplied it". What may NOT be inferred: that the values
        will still be true a moment later (a deploy is not atomic with a read), that they describe the
        instance that served any other request, or that an absent field means a default — there are no
        absent fields.'
