# The joined local stack: backend, its datastores, the frontend, and the Caddy proxy that
# fronts both — one compose project, therefore one network.
#
# Lives here because neither product repo may own it: the frontend cannot name a service it
# does not ship, and the backend has no business knowing a proxy exists.
#
# `include:` rather than `-f a -f b`: with -f every relative path resolves against the FIRST
# file's directory, which breaks `build: { context: . }` in both. Needs Compose >= 2.20.

name: agentapp-stack

include:
  - path: ../chatbot-backend/docker-compose.yml
  - path: ../frontend/docker-compose.yml

services:
  backend:
    # Read back by scripts/service-owner.sh to attribute a stack that did not come up. This
    # is the only file that can see both repos, so it is where ownership is declared.
    labels:
      agentapp.owner: chatbot-backend
    environment:
      # Auth configuration the backend repo cannot supply for itself. Empty is meaningful:
      # the backend fails closed and refuses registration.
      SIGNUP_CODE: ${SIGNUP_CODE:-}
      # Must stay false for this origin — it is http, and smoke.py's cookie jar never
      # returns a Secure cookie over http. See contracts/README.md.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

  postgres:
    labels:
      agentapp.owner: chatbot-backend

  redis:
    labels:
      agentapp.owner: chatbot-backend

  frontend:
    labels:
      agentapp.owner: frontend

  proxy:
    labels:
      agentapp.owner: frontend
    environment:
      BACKEND_UPSTREAM: backend:8000
    # The included file gives proxy no healthcheck, so `up --wait` would call it ready the
    # instant the container starts and smoke would race it. Wait on the origin itself.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
