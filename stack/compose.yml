# The joined local stack: backend, its datastores, the frontend, the Caddy proxy that
# fronts both, and the one-shot eval runner — one compose project, therefore one network.
#
# Lives here because neither product repo may own it: the frontend cannot name a service it
# does not ship, and the backend has no business knowing a proxy exists.
#
# `include:` rather than `-f a -f b`: with -f every relative path resolves against the FIRST
# file's directory, which breaks `build: { context: . }` in both. Needs Compose >= 2.20.

name: agentapp-stack

include:
  - path: ../chatbot-backend/docker-compose.yml
  - path: ../frontend/docker-compose.yml
  - path: ../chatbot-eval/docker-compose.yml

services:
  backend:
    # The joined stack's shared provider credentials — ONE file for every service that
    # needs them, rather than a copy per product repo. `required: false` so a fresh clone
    # and CI come up with none and run credential-free.
    #
    # MEASURED, not assumed: compose APPENDS env_file across `include:`, and this
    # stack-level entry WINS over the submodule's own `.env` on a shared name — so a
    # developer keeps their per-repo file for `cd <repo> && make up` and the joined stack
    # takes its values from here. docs/adr/0016.
    env_file:
      - path: ./secrets.env
        required: false
    # Read back by scripts/service-owner.sh to attribute a stack that did not come up. This
    # is the only file that can see both repos, so it is where ownership is declared.
    labels:
      agentapp.owner: chatbot-backend
    environment:
      # Auth configuration the backend repo cannot supply for itself. Empty is meaningful:
      # the backend fails closed and refuses registration.
      SIGNUP_CODE: ${SIGNUP_CODE:-}
      # Must stay false for this origin — it is http, and smoke.py's cookie jar never
      # returns a Secure cookie over http. See contracts/README.md.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # 10 MB, matching the backend's own default. stack/dev.env records why this stopped
      # being an override.
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-10485760}
      # Build identity, reported by GET /v1/version and recorded by the eval in every
      # experiment. Supplied from outside the image on purpose: an application that
      # invents its own image tag is not reporting one. scripts/publish.sh tags with
      # the submodule SHA; locally this is `dev`.
      IMAGE_TAG: ${BACKEND_IMAGE_TAG:-dev}

  postgres:
    labels:
      agentapp.owner: chatbot-backend

  # The knowledge base's two datastores, both chatbot-backend's. They are DEFINED in that
  # repo's compose file — this block only declares who is answerable when one of them does
  # not come up, which is a question only this file can see the answer to.
  #
  # THE COUPLING IS THE SERVICE NAME. `opensearch` and `minio` must be what chatbot-backend
  # calls them, or compose reads these as new services with no image and refuses to start
  # anything. That is a loud failure rather than a silent misattribution, which is the right
  # way round, but it does mean this file is ahead of the submodule until 0004's backend
  # slice lands.
  opensearch:
    labels:
      agentapp.owner: chatbot-backend

  minio:
    labels:
      agentapp.owner: chatbot-backend

  redis:
    labels:
      agentapp.owner: chatbot-backend

  # The trace store, and the Postgres behind it. Both are chatbot-backend's — it is the only
  # repo that exports to them — and both are DEFINED in that repo's compose file. Same naming
  # coupling as opensearch and minio above: `phoenix` and `phoenix-db` must be what
  # chatbot-backend calls them, or compose reads these as new services with no image and
  # refuses to start anything. Loud, and ahead of the submodule until 0005's slice lands.
  #
  # Nothing here overrides the backend's OTLP endpoint. The backend's own compose file points
  # it at `phoenix:6006`, which resolves on this network because everything is one project —
  # and a joined stack that re-declared it would be the ADR 0006 trap, exported from here and
  # unreachable from anywhere else.
  phoenix:
    labels:
      agentapp.owner: chatbot-backend

  phoenix-db:
    labels:
      agentapp.owner: chatbot-backend

  # The call pipeline, all chatbot-backend's and all DEFINED in its compose file (change
  # 0008): the SQS-compatible queue, the worker that indexes calls, and the simulator that
  # publishes one a minute. Same service-name coupling as above — loud, and ahead of the
  # submodule until 0008's backend slice lands.
  elasticmq:
    labels:
      agentapp.owner: chatbot-backend

  call-worker:
    # Embeds with the backend's embedder, so it needs whatever credentials the backend has.
    env_file:
      - path: ./secrets.env
        required: false
    labels:
      agentapp.owner: chatbot-backend

  call-simulator:
    labels:
      agentapp.owner: chatbot-backend


  # The eval runner: a ONE-SHOT container that black-box tests the running backend and files
  # the result in Phoenix. Defined in chatbot-eval's own compose file — that is where its
  # image, its build context and its `manual` profile live — so `up --wait` never blocks on a
  # container whose whole job is to exit. The loop runs it with `stack.sh run eval`, and
  # `change.yaml`'s `jobs:` says what its exit code has to be. See docs/adr/0013 and 0014.
  #
  # THE COUPLING IS THE SERVICE NAME, as it is for opensearch, minio and phoenix above:
  # `eval` must be what chatbot-eval calls it, or compose reads this as a new service with
  # no image and refuses to start anything. Loud, and ahead of the submodule until 0006's
  # slice lands.
  eval:
    # The joined stack's shared provider credentials — ONE file for every service that
    # needs them, rather than a copy per product repo. `required: false` so a fresh clone
    # and CI come up with none and run credential-free.
    #
    # MEASURED, not assumed: compose APPENDS env_file across `include:`, and this
    # stack-level entry WINS over the submodule's own `.env` on a shared name — so a
    # developer keeps their per-repo file for `cd <repo> && make up` and the joined stack
    # takes its values from here. docs/adr/0016.
    env_file:
      - path: ./secrets.env
        required: false
    labels:
      agentapp.owner: chatbot-eval
    # Waited on here rather than in chatbot-eval's own compose file, which cannot name a
    # service it does not ship. `stack.sh run` starts these if they are not already up,
    # which is what makes `make eval` work without a separate `make up` first.
    depends_on:
      backend:
        condition: service_healthy
      call-worker:
        condition: service_healthy
      proxy:
        condition: service_healthy
      phoenix:
        condition: service_healthy
    environment:
      # THROUGH THE PROXY, not `backend:8000`. The eval measures the origin a client
      # actually uses, and stripping /api is part of what is being measured — see
      # contracts/README.md § "The /api/ prefix is an asserted invariant". A run against
      # the backend directly would pass while the deployed edge was misconfigured.
      EVAL_BACKEND_BASE_URL: ${EVAL_BACKEND_BASE_URL:-http://proxy:8080/api}
      # Phoenix on this network. Not the host port: the eval is a container.
      EVAL_PHOENIX_BASE_URL: ${EVAL_PHOENIX_BASE_URL:-http://phoenix:6006}
      # The eval's OWN project. The backend keeps exporting to its own — a service's
      # project is that service's configuration, and a client that could choose where its
      # traces are filed would be a way to write into somebody else's store. So one eval
      # example produces one trace with halves in two projects, joined by the trace id.
      EVAL_PHOENIX_PROJECT_NAME: ${EVAL_PHOENIX_PROJECT_NAME:-chatbot-eval}
      EVAL_DATASET_NAME: ${EVAL_DATASET_NAME:-chatbot-eval}
      # The eval's own account IS its dedicated collection: the knowledge base is scoped by
      # account, so it can see nobody else's documents. The bare `-` and no default: unset
      # must mean unset, and the eval refuses to run rather than inventing an identity.
      EVAL_ACCOUNT_EMAIL: ${EVAL_ACCOUNT_EMAIL-}
      EVAL_ACCOUNT_PASSWORD: ${EVAL_ACCOUNT_PASSWORD-}
      # Registration is gated, and the eval registers itself on a cold stack.
      SIGNUP_CODE: ${SIGNUP_CODE:-}
      # The marker every document the eval uploads carries in its filename, and the ONLY
      # documents it will ever delete. An EVAL_ACCOUNT_EMAIL pointed at a real account by
      # mistake therefore costs nothing.
      EVAL_DOCUMENT_PREFIX: ${EVAL_DOCUMENT_PREFIX:-eval__}
      # The thread marker, and the only prefix the eval will ever DELETE. It purges its
      # own marked threads at the start of every run, so a re-run leaves the account as
      # it found it — 36 threads had accumulated over two runs before this.
      EVAL_THREAD_PREFIX: ${EVAL_THREAD_PREFIX:-eval__}
      # Where the eval publishes its fixture calls, as CallCompleted events — the same queue
      # the simulator feeds (contracts/events/). ElasticMQ takes any key; the pair below is
      # used for the SQS client ONLY, so a real AWS session in secrets.env still reaches the
      # Bedrock judge. Remotely both are unset and the default chain applies.
      EVAL_CALL_QUEUE_URL: ${EVAL_CALL_QUEUE_URL:-http://elasticmq:9324/000000000000/calls}
      EVAL_SQS_ACCESS_KEY_ID: ${EVAL_SQS_ACCESS_KEY_ID:-local}
      EVAL_SQS_SECRET_ACCESS_KEY: ${EVAL_SQS_SECRET_ACCESS_KEY:-local}
      # The eval image's OWN version, recorded in every experiment's metadata as a
      # comparability factor beside fixture_hash. Supplied from outside the image and
      # never invented — the same rule the backend's IMAGE_TAG has. docs/adr/0015.
      EVAL_IMAGE_TAG: ${EVAL_IMAGE_TAG-}
      # heuristic needs no credentials and no network, which is the whole reason it is the
      # default — the same argument as CHAT_MODEL=echo and RETRIEVAL_ROUTER=heuristic in the
      # backend. It produces a real, deterministic, POOR score: it proves the mechanism,
      # never the quality. `EVAL_JUDGE=bedrock make eval` is the real judge.
      EVAL_JUDGE: ${EVAL_JUDGE:-heuristic}
      EVAL_JUDGE_MODEL_ID: ${EVAL_JUDGE_MODEL_ID:-}
      EVAL_JUDGE_PROMPT_VERSION: ${EVAL_JUDGE_PROMPT_VERSION:-}
      # The gate. Aggregate below threshold means exit 1. The two judge-based thresholds
      # are 0 in stack/dev.env and that is deliberate — read the comment there.
      EVAL_THRESHOLD_ROUTING_ACCURACY: ${EVAL_THRESHOLD_ROUTING_ACCURACY:-}
      EVAL_THRESHOLD_RETRIEVAL_RECALL: ${EVAL_THRESHOLD_RETRIEVAL_RECALL:-}
      EVAL_THRESHOLD_GROUNDEDNESS: ${EVAL_THRESHOLD_GROUNDEDNESS:-}
      EVAL_THRESHOLD_ANSWER_CORRECTNESS: ${EVAL_THRESHOLD_ANSWER_CORRECTNESS:-}

  frontend:
    labels:
      agentapp.owner: frontend

  proxy:
    labels:
      agentapp.owner: frontend
    environment:
      BACKEND_UPSTREAM: backend:8000
    # The included file gives proxy no healthcheck, so `up --wait` would call it ready the
    # instant the container starts and smoke would race it. Wait on the origin itself.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
