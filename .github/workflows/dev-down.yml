# Take dev to zero from the Actions tab, or `make dev-down VIA=ci`. The same two targets
# `make dev-down` runs locally: destroy, then prove nothing billable is still tagged for
# dev. Bootstrap survives by design. No loop calls this. docs/adr/0018 §10.
name: dev-down

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "type dev"
        type: string
        required: true

permissions:
  contents: read

jobs:
  dev-down:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same group as dev-push: a teardown must not interleave with a deploy.
    concurrency:
      group: env-dev
      cancel-in-progress: false
    steps:
      - name: Confirmed
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: '[ "$CONFIRM" = "dev" ] || { echo "::error::confirm must be dev"; exit 2; }'

      - name: The pushed session is still alive
        env:
          EXPIRES: ${{ secrets.DEV_AWS_CREDENTIALS_EXPIRE_AT }}
        run: |
          [ -n "$EXPIRES" ] || { echo "::error::no DEV_AWS_CREDENTIALS_EXPIRE_AT — run \`make login && make push-gh-creds\`"; exit 2; }
          left=$(( ( $(date -d "$EXPIRES" +%s) - $(date +%s) ) / 60 ))
          [ "$left" -ge 30 ] || { echo "::error::the pushed AWS session expires in $left min — run \`make login && make push-gh-creds\`"; exit 2; }

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.DEV_AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.DEV_AWS_REGION }}
          role-to-assume: ${{ vars.DEV_AWS_DEPLOYER_ROLE_ARN }}
          role-chaining: true
          role-duration-seconds: 3600
          role-session-name: dev-down-${{ github.run_id }}

      - uses: actions/checkout@v4
        with:
          submodules: false

      # Whatever infra main is: teardown reads the state, not the commit that wrote it.
      - uses: actions/checkout@v4
        with:
          repository: Paggio/infra
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY_INFRA }}
          path: infra

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Destroy
        run: make -C infra destroy ENV=dev CONFIRM=dev
      - name: Nothing billable is left
        run: make -C infra leftovers ENV=dev
