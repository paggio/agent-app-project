# The machine half of a change. BRIEF.md is for humans and for the implementing agent;
# this is what the scripts parse.

change: 0000-example-change

# The commit that landed contracts/ alone. The dispatch extracts contracts/ at exactly this
# SHA and gives the slices nothing else, so it refuses to run without one.
freeze_sha: ""

# Which repos get a slice. Each needs a matching <name>.md here. Use the SUBMODULE PATH:
# chatbot-backend, not backend.
slices:
  - chatbot-backend
  - frontend
  - infra

deploy:
  # Required when infra is true, and no default — a default is how prod gets applied by a
  # typo. Not "local": that is the boolean below. See docs/infra-interface.md.
  # environment: staging

  # Bring up the joined stack and smoke it. Effectively always true.
  local: true
  # A real deploy. Requires an infra slice.
  infra: false

# ONE-SHOT JOBS, optional. A container the loop runs to completion inside the joined
# stack, whose EXIT CODE is the assertion. For a criterion whose oracle is a process rather
# than a request — smoke.py speaks HTTP against a stack somebody else brought up, so it can
# never start one. See docs/adr/0014. Delete this block if the change has none.
#
#   name         unique; names the log (runs/<ts>/job-<name>.log) and the failing stage
#   service      a service stack/compose.yml declares. Put it in a `manual` profile so
#                `up --wait` never blocks on a container that is supposed to exit.
#   owner        the repo answerable. ROUTES THE REPAIR, exactly as a smoke step's does,
#                and must be a slice of this change.
#   expect_exit  the code that means this job did its job. 0-125.
#   timeout_s    kill it after this long and fail (default 900)
#   env          KEY: VALUE overrides for this run only. No whitespace in a value — they
#                are passed as space-separated pairs. This is how one job proves the
#                happy path and a second proves the refusal.
#
# Jobs run BEFORE smoke, because a job produces the state the suite then asserts.
# jobs:
#   - name: <what this run proves>
#     service: <service>
#     owner: chatbot-eval
#     expect_exit: 0
#     timeout_s: 900

smoke:
  file: smoke.yaml
  # The single origin a browser uses: app at /, API at /api/. Not the backend's own port —
  # that cannot catch a broken proxy.
  base: http://localhost:8080
  timeout_s: 120
  # Also run the frontend's Playwright suite against the joined origin. Set it when a
  # criterion can only be proved in a browser.
  e2e: false
