# Acceptance criteria, made executable. Run against the joined stack; a failure is fed back
# to the repo named in `owner`. Write them while planning — a criterion in BRIEF.md that
# never became a step here is a criterion nobody checks.
#
# Step shape (smoke.py owns it; `./scripts/smoke.py --lint <suite>` checks all of this
# without making a request, and manifest.py --validate runs that for you):
#   name      unique, stable — it appears in the repair prompt sent back to the agent
#   owner     the repo answerable for this step. THIS FIELD ROUTES THE REPAIR.
#   GET/POST/PUT/PATCH/DELETE/HEAD/OPTIONS   the path, relative to `base` in change.yaml
#   headers   map, optional
#   body      JSON body, optional
#   form      form-encoded body, optional
#   base      a different origin for this step only (env vars interpolate)
#   expect    REQUIRED: status (int or list) | json (deep subset) | body_matches (regex)
#             | body_excludes (regex) | headers {name: regex} | cookie (name or list).
#             No exemption — a step with no expect passes on any response, including a 500.
#   capture   {var: dotted.json.path | header:Name | cookie:name}, bound into ${var} later
#   retry     {attempts: 3, delay: 1.0} for anything eventually consistent
#   contract  false when this is not API surface (the app shell, a static asset)
#   tags      [local] or [remote]. UNTAGGED RUNS IN BOTH PASSES — tag a step only to opt it
#             out. local = no remote analogue; remote = cannot hold locally.
#
# Cookies persist across steps within a run, so register -> login -> me works. The two
# passes are separate processes, so never depend on a variable captured in the other.
#
# Variables are declared in stack/dev.env. ${SMOKE_RUN_ID} is the run nonce — use it in
# every identity a step creates. ${SMOKE_ORIGIN} is the origin under test.

# `steps: []` is REFUSED by manifest.py --validate.
steps: []

